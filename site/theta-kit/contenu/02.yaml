theme: null
pdf: { chemin: "/pdf/theta-02.pdf", pages: 6, type: carrousel, langue: fr }
couverture: "/covers/theta-02.webp"

pages:
  - num: 2
    rappel: { fr: "Nº 01 : un modèle, tiré d’exemples, prédit la réponse de cas nouveaux.", en: "Nº 01: a model, drawn from examples, predicts the answer for new cases." }
    titre: { fr: "Un exemple, c’est une ligne.", en: "An example is a row." }
    texte:
      fr: "Ici, le modèle apprend d’exemples à la réponse connue. Pour lui, une maison n’est qu’une ligne de tableau : surface, chambres, quartier, puis prix, la réponse à apprendre."
      en: "Here, the model learns from examples whose answer is known. To it, a house is just a row in a table: area, bedrooms, neighbourhood, then price, the answer to learn."
    tableau:
      colonnes: ["Gr Liv Area", "Bedroom AbvGr", "Neighborhood", "SalePrice"]
      lignes: [[83, 2, "North Ames", 62000000]]
      legende: { fr: "une vente à Ames en 2010", en: "one sale in Ames in 2010" }
  - num: 3
    rubrique: { fr: "Mécanisme", en: "Mechanism" }
    titre: { fr: "Lignes, colonnes, étiquette.", en: "Rows, columns, label." }
    texte:
      fr: "Trois ventes d’Ames, aux États-Unis, en 2010 ; colonnes sous leurs noms d’origine. Chaque ligne est un exemple ; ici, chaque colonne sauf la dernière, une caractéristique : une variable d’entrée. La dernière, l’étiquette, est la réponse à apprendre en apprentissage supervisé : le prix. Converties en m² et FCFA, cours BCEAO du 27 octobre 2026."
      en: "Three sales in Ames, in the United States, in 2010; columns under their original names. Each row is an example; here, each column except the last is a feature: an input variable. The last one, the label, is the answer to learn in supervised learning: the price. Converted to m² and FCFA, BCEAO rate of 27 October 2026."
    tableau:
      colonnes: ["Gr Liv Area", "Bedroom AbvGr", "Neighborhood", "SalePrice"]
      unites: ["m²", "", "", "FCFA"]
      lignes:
        - [83, 2, "North Ames", 62000000]
        - [195, 4, "College Creek", 141000000]
        - [106, 3, "Old Town", 57000000]
    encadres:
      fr: ["Une ligne : un exemple, une maison et tout ce qu’on en sait.", "Une colonne : une caractéristique, la même information pour toutes les maisons."]
      en: ["A row: an example, a house and everything we know about it.", "A column: a feature, the same information for every house."]
  - num: 4
    rubrique: { fr: "Piège", en: "Trap" }
    titre: { fr: "Un quartier n’est pas une quantité.", en: "A neighbourhood is not a quantity." }
    texte:
      fr: "Beaucoup de modèles ne reçoivent que des nombres : le nom du quartier doit alors être converti. Le piège : donner un numéro par quartier, comme dans ce tableau. Selon le modèle, ces numéros risquent d’être lus comme des quantités, comme si Old Town comptait trois fois plus que North Ames."
      en: "Many models only accept numbers: the neighbourhood name must then be converted. The trap: giving each neighbourhood a number, as in this table. Depending on the model, these numbers may be read as quantities, as if Old Town counted three times more than North Ames."
    tableau:
      colonnes: ["quartier", "numéro"]
      lignes: [["North Ames", 1], ["College Creek", 2], ["Old Town", 3]]
    ce_que_ca_veut_dire:
      fr: "Même piège avec des couleurs numérotées : le modèle y lirait un ordre et des écarts qui n’existent pas."
      en: "Same trap with numbered colours: the model would read an order and gaps that do not exist."
  - num: 5
    rubrique: { fr: "Mécanisme", en: "Mechanism" }
    titre: { fr: "Une colonne par quartier.", en: "One column per neighbourhood." }
    texte:
      fr: "Comment le modèle peut-il alors reconnaître un quartier ? Une solution parmi d’autres : une colonne par quartier. Pour chaque maison, la colonne de son quartier vaut 1, toutes les autres valent 0. Le modèle ne compare plus des numéros : il lit seulement si la maison est, ou non, dans chaque quartier."
      en: "How can the model recognise a neighbourhood, then? One solution among others: one column per neighbourhood. For each house, the column of its neighbourhood is 1, all the others are 0. The model no longer compares numbers: it only reads whether the house is, or is not, in each neighbourhood."
    tableau:
      colonnes: ["quartier", "North Ames", "College Creek", "Old Town"]
      lignes: [["North Ames", 1, 0, 0], ["College Creek", 0, 1, 0], ["Old Town", 0, 0, 1]]

