pages:
  - num: 2
    rappel: { fr: "Nº 01 : le modèle apprend d’exemples ; Nº 02 : une maison est une ligne, et son prix est l’étiquette.", en: "Nº 01: the model learns from examples; Nº 02: a house is a row, and its price is the label." }
    titre: { fr: "Trois façons d’apprendre.", en: "Three ways to learn." }
    texte:
      fr: "Les données n’ont pas toujours leur réponse. Trois grandes familles, des repères plutôt qu’une liste complète : supervisé, avec les réponses ; non supervisé, sans elles ; par renforcement, en agissant."
      en: "Data does not always come with its answer. Three broad families, landmarks rather than a complete list: supervised, with the answers; unsupervised, without them; reinforcement, by acting."
  - num: 3
    rubrique: { fr: "Comparaison", en: "Comparison" }
    titre: { fr: "Avec ou sans étiquettes.", en: "With or without labels." }
    texte:
      fr: "En apprentissage supervisé, chaque exemple a son étiquette, comme le prix de chaque maison de l’épisode 02 : le modèle apprend à la retrouver. En non supervisé, il n’y en a pas : le modèle cherche une structure, par exemple des groupes d’exemples semblables."
      en: "In supervised learning, each example has its label, like the price of each house in episode 02: the model learns to recover it. In unsupervised learning there is none: the model looks for structure, for example groups of similar examples."
    encadres:
      fr: ["Retrouver l’étiquette : chaque point a sa couleur, celle de son étiquette.", "Trouver des groupes : sans étiquette, des groupes trouvés, pas forcément des catégories réelles."]
      en: ["Recover the label: each point has its colour, that of its label.", "Find groups: without labels, groups are found, not necessarily real categories."]
    exemple_classique:
      fr: "Un jeu de données publié en 1936 décrit 150 fleurs d’iris. Avec l’espèce de chaque fleur, on apprend à la reconnaître d’après ses mesures ; sans elle, on peut chercher des groupes."
      en: "A dataset published in 1936 describes 150 iris flowers. With each flower’s species, we learn to recognise it from its measurements; without it, we can look for groups."
  - num: 4
    rubrique: { fr: "Repère", en: "Landmark" }
    titre: { fr: "Un nombre ou une catégorie.", en: "A number or a category." }
    texte:
      fr: "Que prédit un modèle supervisé pour un cas nouveau ? Deux tâches reviennent souvent. La régression prédit un nombre, comme le prix d’une maison. La classification prédit une catégorie, comme l’espèce d’une fleur, ou spam et non-spam dans l’épisode 01."
      en: "What does a supervised model predict for a new case? Two tasks come up often. Regression predicts a number, like the price of a house. Classification predicts a category, like the species of a flower, or spam and not spam in episode 01."
    encadres:
      fr: ["Régression : prédire un nombre, un prix, un montant.", "Classification : prédire une catégorie, une espèce, spam ou non."]
      en: ["Regression: predict a number, a price, an amount.", "Classification: predict a category, a species, spam or not."]
  - num: 5
    rubrique: { fr: "Mécanisme", en: "Mechanism" }
    titre: { fr: "Apprendre en agissant.", en: "Learning by acting." }
    texte:
      fr: "Et la troisième famille, celle qui agit ? Certains algorithmes ne se contentent pas d’un jeu de données fixe. En apprentissage par renforcement, le système agit dans un environnement, reçoit un retour, positif ou négatif, puis recommence : ses actions peuvent changer les données qu’il reçoit ensuite."
      en: "And the third family, the one that acts? Some algorithms do not settle for a fixed dataset. In reinforcement learning, the system acts in an environment, receives feedback, positive or negative, then starts again: its actions can change the data it receives next."
    encadres:
      fr: ["Supervisé, non supervisé : le plus souvent, le modèle apprend d’un jeu de données fixe, réuni à l’avance.", "Par renforcement : le système produit ses expériences en agissant ; elles peuvent changer avec ses actions."]
      en: ["Supervised, unsupervised: most often, the model learns from a fixed dataset gathered in advance.", "Reinforcement: the system produces its experiences by acting; they can change with its actions."]

