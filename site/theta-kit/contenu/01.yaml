post_linkedin:
  statut: a_valider      # texte du document projet « texte post » (5 nov. 2026), revu par la direction éditoriale avant publication
  fr: |-
    Un programme classique suit des règles écrites à la main.
    Le Machine Learning les tire d’exemples.

    Pensez au tri de vos mails. En 2019, Google indiquait bloquer environ 100 millions de spams de plus chaque jour grâce à TensorFlow, un outil d’apprentissage développé par Google. Selon le même billet, l’apprentissage permet de s’adapter vite à des spams qui changent sans cesse.

    Le carrousel part du spam, une tâche où les règles écrites à la main ne suffisent pas, remonte au programme de dames d’Arthur Samuel en 1959, et finit sur une limite : loin de ses exemples, rien ne garantit la réponse d’un modèle.

    Quelle tâche de votre quotidien serait difficile à décrire avec des règles écrites ?

    Nº 01 · θ Théta, le Machine Learning, une notion à la fois. Épisode suivant · Nº 02 : Données, caractéristiques et étiquettes.
  en: |-
    A classic program follows rules written by hand.
    Machine Learning draws them from examples.

    Think about how your email gets sorted. In 2019, Google said it was blocking about 100 million additional spam messages every day thanks to TensorFlow, a machine learning tool developed by Google. According to the same post, learning makes it possible to adapt quickly to spam that keeps changing.

    The carousel starts from spam, a task where hand-written rules are not enough, goes back to Arthur Samuel’s checkers program in 1959, and ends on a limit: far from its examples, nothing guarantees a model’s answer.

    Which task in your daily life would be hard to describe with written rules?

    Nº 01 · θ Théta, Machine Learning, one concept at a time. Next episode · Nº 02: Data, features and labels.
