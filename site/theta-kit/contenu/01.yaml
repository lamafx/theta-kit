pages:
  - num: 2
    rubrique: { fr: "Épisode 1 · Saison 1", en: "Episode 1 · Season 1" }
    titre: { fr: "Qu’est-ce que le Machine Learning ?", en: "What is Machine Learning?" }
    texte:
      fr: "Programme classique : règles écrites à la main. Machine Learning : modèle tiré d’exemples. Ici, apprentissage supervisé : chaque exemple a sa réponse ; le modèle prédit celle de cas nouveaux."
      en: "Classic program: rules written by hand. Machine Learning: a model drawn from examples. Here, supervised learning: each example has its answer; the model predicts the answer for new cases."
    schema:
      fr: ["Programme classique : Règles + données → Programme → Réponses", "Apprentissage supervisé : Données + réponses → Apprentissage → Modèle"]
      en: ["Classic program: Rules + data → Program → Answers", "Supervised learning: Data + answers → Learning → Model"]
  - num: 3
    rubrique: { fr: "Exemple", en: "Example" }
    titre: { fr: "Le spam : trop de règles à écrire à la main.", en: "Spam: too many rules to write by hand." }
    texte:
      fr: "Certaines tâches sont trop difficiles pour des règles écrites à la main. En 2019, Google indique bloquer dans Gmail plus de 99,9 % des spams, du phishing et des maliciels, en combinant règles et apprentissage, qui repère des motifs que les auteurs de règles pourraient manquer."
      en: "Some tasks are too hard for hand-written rules. In 2019, Google reported blocking more than 99.9% of spam, phishing and malware in Gmail by combining rules and machine learning, which spots patterns that rule writers might miss."
    schema:
      fr: ["Apprendre : Mails déjà triés → Apprentissage → Modèle", "Trier : Nouveau mail → Modèle → Spam / Non-spam"]
      en: ["Learn: Already-sorted emails → Learning → Model", "Sort: New email → Model → Spam / Not spam"]
    legende: { fr: "Le tri du spam, simplifié. Schéma", en: "Spam filtering, simplified. Diagram" }
  - num: 4
    rubrique: { fr: "Contexte", en: "Context" }
    titre: { fr: "1959 : un programme apprend à jouer mieux que son auteur.", en: "1959: a program learns to play better than its author." }
    texte:
      fr: "En 1959, Arthur Samuel emploie le terme machine learning dans le titre d’un article sur un programme de dames. L’auteur lui fournit des critères ; en jouant, le programme apprend lesquels comptent. Selon l’article, après 8 à 10 heures de jeu machine, il dépasse son auteur."
      en: "In 1959, Arthur Samuel used the term machine learning in the title of a paper about a checkers program. The author gave it criteria; by playing, the program learned which ones mattered. According to the paper, after 8 to 10 hours of machine play, it surpassed its author."
    image: { fr: "Un IBM 704 au centre Langley de la NACA.", en: "An IBM 704 at NACA’s Langley center.", credit: "Photo : NASA · Public domain · Wikimedia Commons" }
  - num: 5
    rubrique: { fr: "Piège", en: "Trap" }
    titre: { fr: "Loin de ses exemples, rien ne garantit sa réponse.", en: "Far from its examples, nothing guarantees its answer." }
    texte:
      fr: "Le modèle tire ses règles d’un nombre limité d’exemples : il peut bien prédire des cas proches, mais rien ne le garantit. Face à un cas très différent, ses erreurs peuvent augmenter. Les choix humains comptent aussi : Samuel avait écrit les critères parmi lesquels son programme choisissait."
      en: "The model draws its rules from a limited number of examples: it may predict nearby cases well, but nothing guarantees it. Faced with a very different case, its errors can grow. Human choices matter too: Samuel had written the criteria his program chose from."
    ce_que_ca_veut_dire:
      fr: "Les exemples, et les choix de ceux qui conçoivent le modèle, limitent ce qu’il peut apprendre."
      en: "The examples, and the choices of those who design the model, limit what it can learn."

