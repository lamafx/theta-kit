<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Labo 3D θ Théta</title>
<script src="./support.js"></script>
<script src="/_blob/4ff7829355437e45b4e7daba220cc22f"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0F17}
a{color:#CFE0FF}a:hover{color:#FFFFFF}
.lb-stage{position:relative;height:100vh;min-height:640px;overflow:hidden;animation:lb-in 1.15s cubic-bezier(.65,0,.2,1) .08s backwards}
.lb-canvas{position:absolute;inset:0}
.lb-top{position:absolute;left:28px;right:28px;top:22px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lb-tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.lb-stat{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:pre}
.lb-card{position:absolute;left:28px;bottom:28px;z-index:3;width:380px;max-height:calc(100% - 150px);overflow:auto}
.lb-dock{position:absolute;right:28px;bottom:28px;z-index:3;max-width:calc(100% - 470px)}
.lb-glass{background:rgba(10,15,23,0.58);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(207,224,255,0.07)}
.lb-tab{transition:color .3s ease,border-color .3s ease}
.lb-tab:hover{color:#FFFFFF}
.lb-ic{transition:background .25s ease,border-color .25s ease,transform .25s cubic-bezier(.2,.7,.2,1)}
.lb-ic:hover{transform:translateY(-1px);border-color:rgba(207,224,255,0.35)}
.lb-enter{animation:lb-fade .9s cubic-bezier(.4,0,.2,1) .05s forwards}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details[open] .lb-chev{transform:rotate(180deg)}
.lb-chev{transition:transform .3s ease}
@keyframes lb-in{from{clip-path:circle(0% at 50% 50%);transform:scale(1.06);filter:brightness(1.6)}60%{filter:brightness(1.08)}to{clip-path:circle(150% at 50% 50%);transform:scale(1);filter:none}}
@keyframes lb-fade{to{opacity:0;visibility:hidden}}
@keyframes lb-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.lb-toast{animation:lb-pop 2.4s ease forwards}
input[type=range]{width:100%;height:24px;margin:0;accent-color:#F5F8FC}
.lb-scroll::-webkit-scrollbar{width:4px;height:4px}.lb-scroll::-webkit-scrollbar-thumb{background:#2E3B4D;border-radius:4px}
@media (max-width:980px){
.lb-stage{height:auto;min-height:0;overflow:visible;display:flex;flex-direction:column;gap:12px;padding:14px}
.lb-canvas{position:relative;height:60vh;min-height:400px;border-radius:22px;overflow:hidden;order:2}
.lb-top{position:static;order:0}.lb-stat{position:static;transform:none;order:1;text-align:center;white-space:normal}
.lb-dock{position:static;order:3;max-width:none}.lb-card{position:static;width:auto;max-height:none;order:4}
}
@media (prefers-reduced-motion: reduce){.lb-stage,.lb-toast{animation:none}}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: #0A0F17; color: #F5F8FC; font-family: 'Geist', sans-serif">
<div class="lb-stage">

<div class="lb-canvas" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="background: radial-gradient(75% 70% at 55% 48%, #12203B 0%, #0B1220 55%, #0A0F17 100%); touch-action: none; cursor: {{cursor}}; user-select: none">
<canvas data-lab3d="1" ref="{{setCanvas}}" role="img" aria-label="{{sceneLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A97A8">Chargement de la scène</div>
</sc-if>
<sc-if value="{{flash}}" hint-placeholder-val="{{ false }}">
<div class="lb-toast" role="status" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 999px; background: #F5F8FC; color: #0A0F17; pointer-events: none">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #0A0F17; color: #F5F8FC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; line-height: 1">Défi réussi</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #4A5568">{{score}}/6</span>
</div>
</sc-if>
</div>

<header class="lb-top">
<a href="Main.dc.html" onClick="{{goMain}}" style="display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: #F5F8FC">
<svg viewBox="-330 -470 660 940" width="17" height="24" aria-hidden="true" style="align-self: center"><g transform="skewX(-12)"><path fill-rule="evenodd" d="M-270 0 a270 420 0 1 0 540 0 a270 420 0 1 0 -540 0 Z M-176 0 a176 368 0 1 0 352 0 a176 368 0 1 0 -352 0 Z" fill="#F5F8FC"></path><rect x="-178" y="-26" width="356" height="52" fill="#4C8DFF"></rect></g></svg>
<span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; line-height: 1">Théta</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A97A8">Labo</span>
</a>
<nav aria-label="Choisir une notion" class="lb-tabs lb-scroll">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
<button type="button" class="lb-tab" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="flex-shrink: 0; display: inline-flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid {{t.line}}; background: transparent; color: {{t.color}}; font-family: 'Geist', sans-serif; font-size: 14px; cursor: pointer; white-space: nowrap">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{t.numColor}}">{{t.badge}}</span>{{t.title}}<sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><span aria-label="réussi" style="width: 5px; height: 5px; border-radius: 999px; background: #4C8DFF; align-self: center"></span></sc-if>
</button>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 18px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A97A8">Défis <strong style="color: #F5F8FC; font-weight: 500">{{score}}/6</strong></span>
<a class="lb-ic" href="Tunnel.dc.html" onClick="{{goVoyage}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(207,224,255,0.16); color: #F5F8FC; font-size: 14px; text-decoration: none">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>Voyage</a>
</div>
</header>

<div class="lb-stat" style="font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.04em; color: #A7B3C2">{{statLine}}</div>

<section class="lb-card lb-glass lb-scroll" style="border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A97A8"><span style="color: #4C8DFF">Nº {{num}}</span> · {{sub}}</div>
<h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: -0.01em">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #A7B3C2">{{idea}}</p>
<div style="height: 1px; background: rgba(207,224,255,0.08)"></div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.55; color: #E6ECF3">{{msg}}</p>
<details style="border-top: 1px solid rgba(207,224,255,0.08); padding-top: 12px">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 32px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #CFE0FF">Le calcul et la vue 2D<svg class="lb-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></summary>
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{calc}}" as="c" hint-placeholder-count="3">
<div style="font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #CFD8E3; overflow-wrap: anywhere">{{c.t}}</div>
</sc-for>
</div>
<svg viewBox="0 0 300 200" style="width: 100%; height: auto; display: block; border-radius: 14px; background: rgba(10,15,23,0.6)" role="img" aria-label="{{chartTitle}}">
<defs><marker id="lb-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F5F8FC"></path></marker></defs>
<sc-for list="{{chartLines}}" as="l" hint-placeholder-count="2"><path d="{{l.d}}" fill="none" stroke="{{l.s}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" marker-end="{{l.m}}" stroke-linecap="round" stroke-linejoin="round" opacity="{{l.o}}"></path></sc-for>
<sc-for list="{{chartDots}}" as="c" hint-placeholder-count="1"><circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" fill="{{c.f}}"></circle></sc-for>
<sc-for list="{{chartTexts}}" as="x" hint-placeholder-count="1"><text x="{{x.x}}" y="{{x.y}}" fill="{{x.f}}" font-size="11" font-family="Geist Mono, monospace" text-anchor="{{x.a}}">{{x.t}}</text></sc-for>
</svg>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="2">
<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #A7B3C2"><span style="width: 14px; height: 2px; border-radius: 2px; background: {{l.c}}"></span>{{l.t}}</span>
</sc-for>
</div>
</div>
</details>
<div style="display: flex; align-items: flex-start; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(207,224,255,0.08)">
<span style="flex-shrink: 0; margin-top: 6px; width: 7px; height: 7px; border-radius: 999px; background: {{statusDot}}; box-shadow: {{statusGlow}}"></span>
<span style="font-size: 13px; line-height: 1.5; color: #A7B3C2"><span style="color: #F5F8FC">Défi.</span> {{goal}} <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: {{statusColor}}">{{statusTxt}}</span></span>
</div>
</section>

<div class="lb-dock lb-glass" style="border-radius: 999px; padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<sc-if value="{{hasPlay}}" hint-placeholder-val="{{ true }}">
<button type="button" class="lb-ic" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: #F5F8FC; color: #0A0F17; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if>
</button>
<button type="button" class="lb-ic" onClick="{{doStep}}" aria-label="Faire un pas" style="width: 48px; height: 48px; border: 1px solid rgba(207,224,255,0.14); border-radius: 999px; background: transparent; color: #F5F8FC; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5l8 7-8 7"></path><path d="M18 5v14"></path></svg></button>
</sc-if>
<button type="button" class="lb-ic" onClick="{{doReset}}" aria-label="Replacer le robot" style="width: 48px; height: 48px; border: 1px solid rgba(207,224,255,0.14); border-radius: 999px; background: transparent; color: #F5F8FC; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
<sc-if value="{{hasSlider}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 0; width: 210px; padding: 0 14px">
<label for="lb-sl" style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A97A8"><span>{{slLabel}}</span><span style="color: #F5F8FC">{{slTxt}}</span></label>
<input id="lb-sl" type="range" min="{{slMin}}" max="{{slMax}}" step="{{slStep}}" value="{{slVal}}" onChange="{{slChange}}">
</div>
</sc-if>
<sc-if value="{{hasBatch}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; justify-content: center; width: 150px; padding: 0 14px 0 0">
<label for="lb-batch" style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A97A8"><span>lot B</span><span style="color: #F5F8FC">{{batchTxt}}</span></label>
<input id="lb-batch" type="range" min="0" max="3" step="1" value="{{batchIdx}}" onChange="{{onBatch}}">
</div>
</sc-if>
<sc-if value="{{hasToggle}}" hint-placeholder-val="{{ false }}">
<button type="button" class="lb-ic" onClick="{{tgClick}}" aria-pressed="{{tgPressed}}" style="min-height: 48px; padding: 0 20px; border: 1px solid {{tgBorder}}; border-radius: 999px; background: {{tgBg}}; color: {{tgColor}}; font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">{{tgLabel}}</button>
</sc-if>
<button type="button" class="lb-ic" onClick="{{recenter}}" aria-label="Recentrer la vue" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: transparent; color: #8A97A8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</div>

</div>
<div ref="{{setIris}}" aria-hidden="true" style="position: absolute; inset: 0; z-index: 61; pointer-events: none; clip-path: circle(0px at 50% 50%); background: radial-gradient(70% 70% at 50% 50%, #13223F 0%, #0A0F17 72%); display: flex; align-items: center; justify-content: center"><svg viewBox="-330 -470 660 940" width="70" height="100" aria-hidden="true" style="opacity: {{exitOp}}; transition: opacity .45s ease .3s"><g transform="skewX(-12)" fill="none" stroke="#9CC6FF" stroke-width="18"><path d="M-270 0 a270 420 0 1 0 540 0 a270 420 0 1 0 -540 0 Z"></path><path d="M-250 0 H250"></path></g></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["derivee","gradient","descente","minilots","minlocaux","selle"],"default":"descente"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.C = { white: '#F5F8FC', blue: '#4C8DFF', light: '#9CC6FF', pale: '#CFE0FF', bronze: '#D9A066', muted: '#8A97A8', grid: '#2E3B4D' };
this.TH = this.themesDef();
this.ORDER = ['derivee', 'gradient', 'descente', 'minilots', 'minlocaux', 'selle'];
this.BATCH = [1, 8, 32, 256];
let saved = null;
try { saved = window.localStorage.getItem('theta-lab-theme'); if (saved) window.localStorage.removeItem('theta-lab-theme'); } catch (err) { saved = null; }
if (!this.TH[saved]) saved = null;
this.state = { theme: saved, eta: null, batch: 1, noise: false, h: 0.5, playing: false, showNeg: false, stats: [], calc: [], msg: '', chart: null, done: {}, ready: false, flash: false, dragging: false, success: false, exiting: false };
this.view = { yaw: 0, pitch: 0.3 }; this.drag = null; this.params = null; this.anim = null; this.hist = [];
this.steps = 0; this.examples = 0; this.converged = false; this.diverged = false; this.visitedSaddle = false; this.usedNoise = false; this.faceY = 0; this.lastStepT = -1; this.lastUI = 0;
this.setCanvas = (el) => { if (el) this.canvas = el; };
this.setIris = (el) => { this.irisEl = el; };
this.onDown = (e) => this.pDown(e);
this.onMove = (e) => this.pMove(e);
this.onUp = () => this.pUp();
this.goVoyage = (e) => this.leave(e);
this.goMain = (e) => this.leave(e);
this.togglePlay = () => { if (!this.three) return; if (this.diverged) this.resetPos(); this.converged = false; this.lastStepT = -1; this.setState({ playing: !this.state.playing }); };
this.doStep = () => { if (!this.three) return; if (this.diverged) this.resetPos(); this.converged = false; this.setState({ playing: false }); this.stepOnce(); };
this.doReset = () => { if (!this.three) return; this.setState({ playing: false }); this.resetPos(); };
this.onEta = (e) => this.setState({ eta: parseFloat(e.target.value) });
this.onBatch = (e) => this.setState({ batch: parseInt(e.target.value, 10) });
this.onH = (e) => this.setState({ h: parseFloat(e.target.value) });
this.toggleNoise = () => this.setState({ noise: !this.state.noise });
this.toggleNeg = () => this.setState({ showNeg: !this.state.showNeg });
this.push = () => {
if (!this.three || !this.params) return;
const p = this.params; this.converged = false;
this.animTo([p[0], p[1] + (Math.random() < 0.5 ? -0.12 : 0.12)], 0.45, 0.12);
};
this.recenter = () => { this.viewT = { yaw: 0.0, pitch: this.th().kind === '1d' ? 0.3 : 0.62 }; };
this.picks = {};
this.ORDER.forEach((k) => { this.picks[k] = () => this.pickTheme(k); });
}
leave(e) {
if (this.leaving) return;
if (e && e.preventDefault) e.preventDefault();
const a = e && e.currentTarget; if (!a || this.state.exiting) return;
this.setState({ exiting: true, playing: false });
const ir = this.irisEl;
if (ir) {
const rr = ir.getBoundingClientRect(); const ar = a.getBoundingClientRect();
const x = (e.clientX ? e.clientX : ar.left + ar.width / 2) - rr.left, y = (e.clientY ? e.clientY : ar.top + ar.height / 2) - rr.top;
ir.style.transition = 'none'; ir.style.clipPath = 'circle(0px at ' + x + 'px ' + y + 'px)'; void ir.offsetWidth;
ir.style.transition = 'clip-path .8s cubic-bezier(.7,0,.25,1)'; ir.style.clipPath = 'circle(150% at ' + x + 'px ' + y + 'px)';
}
setTimeout(() => {
if (this.dead) return; this.leaving = true;
try { a.click(); } catch (err) {}
setTimeout(() => { if (!this.dead) { this.leaving = false; if (this.irisEl) { this.irisEl.style.transition = 'none'; this.irisEl.style.clipPath = 'circle(0px at 50% 50%)'; } this.setState({ exiting: false }); } }, 1400);
}, 820);
}

themesDef() {
const C = this.C;
const lm = (x) => 0.42 * Math.pow(x * x - 0.9, 2) + 0.16 * x;
const dlm = (x) => 1.68 * x * (x * x - 0.9) + 0.16;
return {
derivee: { id: 'derivee', num: '06', badge: '06', title: 'La dérivée', tab: 'Dérivée', sub: 'La pente en un point', kind: '1d',
J: (x) => x * x, dJ: (x) => 2 * x, xmin: -2, xmax: 2, sx: 0.85, sy: 0.32, base: -0.75, start: [1.5],
idea: 'J′(a) mesure la pente de J au point a : son signe dit si J monte ou descend, sa taille dit à quelle vitesse. Glissez le robot, puis réduisez h.',
formula: 'J(a) = a²', goal: 'placez le robot là où la pente vaut 0.', ctl: { h: true },
legend: [[C.white, 'tangente J′(a)'], [C.bronze, 'sécante entre a et a + h']] },
gradient: { id: 'gradient', num: '07', badge: '07', title: 'Le gradient', tab: 'Gradient', sub: 'Deux réglages, une flèche', kind: '2d',
J: (a, b) => a * a + 3 * b * b, G: (a, b) => [2 * a, 6 * b], ra: 1.6, rb: 1.0, s: 1.0, sy: 0.2, base: -0.75, jmin: 0, jmax: 5.6, start: [1.2, 0.6], k: 0.16,
idea: 'Une pente par réglage : ∂J/∂a et ∂J/∂b. Le gradient ∇J les réunit en une flèche qui pointe vers la montée la plus raide. Placez le robot n’importe où.',
formula: 'J(a, b) = a² + 3b²', goal: 'amenez le robot là où ∇J est presque nul.', ctl: { neg: true },
