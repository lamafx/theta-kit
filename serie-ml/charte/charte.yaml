    icone: '#8A919C'  # icônes, flèche du gradient
    bord_carte: '#1B2533'  # bord des cartes des planches de bibliothèque
    texte_bloc_sombre: '#C9D3DF'  # texte des blocs sur fond sombre
polices:
  texte: Geist
  etiquettes: Geist Mono
  formules: STIX Two Text
  # Geist, Geist Mono et STIX Two Text n'ont ni ∇ (U+2207) ni l'espace fine insécable (U+202F).
  # Chaque @font-face reçoit une règle de complément : même famille, même poids, même style,
  # limitée à ces caractères, pour qu'aucune police du système ne les dessine.
  complement:
    fichier: stix-two-math-latin-400-normal.woff2
    unicode_range: U+2207, U+202F
  # Geist et Geist Mono n'ont pas de lettres grecques (A29) : hors formule (« paramètre θ », tableaux,
  # étiquettes des visuels), elles sont dessinées par STIX Two Text, la police des formules.
  grecques:
    fichier: stix-two-text-greek-400-normal.woff2
    unicode_range: U+0370-03FF
    familles:
    - Geist
    - Geist Mono
tailles_px:
