episode: 12
lecteur: "Un professionnel curieux, niveau bac, sans informatique ni mathématiques après le lycée, qui ne se souvient que des pages « À retenir » des épisodes précédents (pour le post : la même personne, qui découvre le texte seule dans son fil LinkedIn sans avoir vu aucun épisode)."
carrousel:
  criteres:
    premier_abord: {note: 8.5, raison: "La couverture et le début de l'ouverture disent clairement l'idée (le prix dépend de plusieurs caractéristiques, chacune a son poids), mais la formule à indices puis « vecteur de poids » demandent un effort à la première lecture."}
    vocabulaire: {note: 8.5, raison: "Le produit scalaire est expliqué en mots et Ames est situé, mais « vecteur » n'est pas redit en mots simples, $w_1$ n'est jamais nommé « le poids de la surface », et « seul le dessin s'arrête » est à deviner."}
    une_notion_par_page: {note: 8, raison: "Les pages 2 et 4 tiennent chacune sur une idée, mais la page 3 en porte trois (le plan, la somme des carrés des erreurs avec la formule chiffrée dans une seule longue phrase, et le produit scalaire dans un encadré)."}
    concret: {note: 8.5, raison: "Les ventes d'Ames, le plan dessiné avec ses pointillés et les schémas portent bien les idées, mais le produit scalaire et le vecteur de poids restent sans exemple chiffré alors que 92,3 et −19,1 sont sur la même page."}
    enchainement: {note: 9, raison: "L'ordre est naturel (plusieurs poids, puis le plan à deux caractéristiques, puis la lecture des poids) ; seule l'entrée de la page 4 ne dit pas qu'elle explique les deux nombres de la page 3."}
    retenu: {note: 9, raison: "Le lecteur répond sans peine à « Vérifiez-vous » (une chambre de plus retire 19,1 millions) et redit l'idée, mais l'encadré « Un poids négatif » le laisse hésiter sur ce qu'il doit penser de ce −19,1."}
  blocages:
  - endroit: "page 2, texte"
    passage: "Le prix prédit dépend de plusieurs caractéristiques : $x_1$ la surface, $x_2$ les chambres… Chacune reçoit son poids : $ŷ$ = $w_1$·$x_1$ + $w_2$·$x_2$ + … + $b$. Les poids forment le **vecteur de poids**."
    pourquoi: "Le lecteur comprend $x_1$ et $x_2$, mais doit deviner que $w_1$ est le poids de $x_1$ ; « vecteur » ne lui dit presque rien (le Nº 07 l'a seulement associé à des pentes « rangées ») : il bute sur la formule puis sur le terme en gras. Touche premier_abord et vocabulaire."
    proposition: "Le prix prédit dépend de plusieurs caractéristiques : $x_1$ la surface, $x_2$ les chambres… Chacune reçoit son poids, $w_1$, $w_2$… : $ŷ$ = $w_1$·$x_1$ + $w_2$·$x_2$ + … + $b$. Rangés en liste, ils forment le **vecteur de poids**."
  - endroit: "page 3, texte"
    passage: "Les pointillés sont les erreurs ; le plan retenu rend la somme de leurs carrés la plus petite : $ŷ$ = 92,3·$x_1$ − 19,1·$x_2$ + 32,6, avec $x_1$ la surface, $x_2$ les chambres."
    pourquoi: "Une seule phrase porte les erreurs, la règle des carrés et la formule chiffrée, coupée en fin de ligne (« + / 32,6 ») : le lecteur doit la relire pour séparer ce qui est choisi (le plan) de ce qui en sort (les nombres). Touche une_notion_par_page."
    proposition: "Chaque vente d'Ames (Iowa), de 2006 à 2010, devient un point : surface en largeur, chambres en profondeur, prix en hauteur. Les pointillés sont les erreurs. Le plan retenu est celui où la somme de leurs carrés est la plus petite. Il s'écrit : $ŷ$ = 92,3·$x_1$ − 19,1·$x_2$ + 32,6."
  - endroit: "page 3, encadré « Au-delà de deux »"
    passage: "Avec $p$ caractéristiques, $p$ poids. Multiplier chaque poids par sa caractéristique, puis tout additionner, s'appelle un **produit scalaire** : le calcul ne change pas, seul le dessin s'arrête."
    pourquoi: "C'est une deuxième notion nouvelle sur la page, sans exemple alors que les nombres sont juste au-dessus ; et « seul le dessin s'arrête » ne dit pas pourquoi (on ne peut pas dessiner plus de trois axes). Touche une_notion_par_page, concret et vocabulaire."
    proposition: "Avec $p$ caractéristiques, $p$ poids. Multiplier chaque poids par sa caractéristique, puis tout additionner, comme 92,3·$x_1$ − 19,1·$x_2$, s'appelle un **produit scalaire**. Le calcul reste le même ; seul le dessin devient impossible au-delà de trois axes."
  - endroit: "page 4, texte"
    passage: "À chambres égales, chaque centaine de m² ajoute 92,3 millions de FCFA au prix prédit."
    pourquoi: "La page démarre sans dire qu'elle explique les deux nombres de la page 3 ; le lecteur fait le lien seul. Touche enchainement."
    proposition: "Que disent 92,3 et −19,1 ? À chambres égales, chaque centaine de m² ajoute 92,3 millions de FCFA au prix prédit. À surface égale, une chambre de plus en retire 19,1. Chaque poids dit l'influence d'une caractéristique quand les autres ne bougent pas."
  - endroit: "page 4, encadré « Un poids négatif »"
    passage: "Or, dans ces ventes, surface et chambres varient ensemble : l'une change souvent avec l'autre. Le modèle sépare donc mal leurs deux effets."
    pourquoi: "Le lecteur ne sait pas quoi conclure : le −19,1 est-il fiable ou non ? « Or » annonce une objection sans dire laquelle, et il relit pour comprendre ce que « séparer leurs effets » change au poids. Touche retenu."
    proposition: "Il compare des maisons de même surface, pas une petite et une grande. Mais dans ces ventes, surface et chambres changent souvent ensemble : le modèle sépare mal l'effet de l'une de celui de l'autre, et ce −19,1 se lit avec prudence."
post:
  criteres:
    accroche: {note: 9, raison: "La première ligne surprend et donne envie de lire, la deuxième dit en mots simples ce qu'est une régression ; seul « Ames, dans l'Iowa » demande un petit effort à qui ne situe pas l'Iowa."}
    vocabulaire: {note: 9, raison: "Poids, biais, BCEAO et régression sont expliqués en mots simples ; seule la phrase « ce calcul trace une droite ; avec deux, un plan » suppose un graphique que le lecteur du fil n'a jamais vu."}
    message: {note: 9, raison: "Le lecteur peut redire qu'un poids se lit les autres caractéristiques fixées, d'où un poids négatif pour les chambres ; mais la dernière phrase du paragraphe 4 le laisse incertain sur la valeur de ce poids."}
    fil: {note: 8.5, raison: "Les paragraphes s'enchaînent, mais la parenthèse sur la conversion BCEAO s'intercale entre le −19,1 et « Ce poids négatif », et la phrase en « Or » du paragraphe 4 doit être relue pour voir son lien avec ce qui précède."}
  blocages:
  - endroit: "post, ligne 2"
    passage: "C'est ce que dit une régression, un modèle qui prédit le prix des maisons d'Ames, dans l'Iowa."
    pourquoi: "Beaucoup de lecteurs ne situent pas l'Iowa ; un mot de plus suffit. Touche accroche."
    proposition: "C'est ce que dit une régression, un modèle qui prédit le prix des maisons d'Ames, une ville de l'Iowa, aux États-Unis."
  - endroit: "post, paragraphe 2"
    passage: "Avec une caractéristique, ce calcul trace une droite ; avec deux, un plan."
    pourquoi: "Le lecteur qui n'a vu aucun épisode ne sait pas où ce calcul « trace » quelque chose, ni à quoi ressemble un plan ici. Touche vocabulaire."
    proposition: "Sur un graphique, avec une caractéristique, ce calcul trace une droite ; avec deux, un plan, comme une feuille inclinée posée au milieu des points."
  - endroit: "post, paragraphe 3"
    passage: "Sur les 2 925 ventes de 2006 à 2010, le poids de la surface vaut 92,3 millions de FCFA par centaine de mètres carrés ; celui des chambres, −19,1 millions. (Les prix sont convertis au cours de la BCEAO, la banque centrale ouest-africaine, du 27 octobre 2026.)"
    pourquoi: "La parenthèse sépare le −19,1 de la phrase suivante, « Ce poids négatif… » : le lecteur remonte pour retrouver de quel poids on parle. Touche fil."
    proposition: "Les prix des 2 925 ventes, de 2006 à 2010, sont convertis en FCFA au cours de la BCEAO, la banque centrale ouest-africaine, du 27 octobre 2026. Le poids de la surface vaut 92,3 millions de FCFA par centaine de mètres carrés ; celui des chambres, −19,1 millions."
  - endroit: "post, paragraphe 4"
    passage: "Or surface et chambres varient ensemble, l'une change souvent avec l'autre : le modèle sépare mal leurs effets."
    pourquoi: "Le lecteur ne voit pas ce que cette phrase change au poids négatif qu'il vient de comprendre : doit-il y croire ou non ? Touche message et fil."
    proposition: "Mais dans ces ventes, surface et chambres changent souvent ensemble : le modèle sépare mal l'effet de l'une de celui de l'autre, et ce −19,1 se lit avec prudence."
