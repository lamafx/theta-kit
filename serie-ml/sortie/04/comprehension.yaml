episode: 4
lecteur: "Professionnel curieux, niveau bac, sans informatique ni mathématiques après le lycée, qui ne se souvient que des pages « À retenir » des Nº 01 à 03 ; pour le post, la même personne qui le découvre seule dans son fil LinkedIn, sans avoir vu aucun épisode."
carrousel:
  criteres:
    premier_abord: {note: 9, raison: "La couverture dit en une phrase claire ce qu'est un modèle et pourquoi les boutons comptent ; à l'ouverture, le symbole $ŷ$ arrive avant son explication (« le chapeau marque une prédiction »), ce qui oblige à revenir en arrière."}
    vocabulaire: {note: 8.5, raison: "Paramètres, $θ$, inclinaison et hauteur de départ sont expliqués ; mais l'équation $ŷ = a·x + b$ n'est jamais lue en mots (le point de multiplication ne dit rien au lecteur) et le « 1 » du triangle bleu de la page 2 reste à deviner."}
    une_notion_par_page: {note: 8.5, raison: "Les pages 2 et 3 portent chacune une idée ; la page 4 empile l'entraînement, la forme choisie d'avance, les paramètres, la lettre $θ$ et le critère d'écart, ce qui demande un effort même si les phrases sont complètes."}
    concret: {note: 8.5, raison: "La droite des prix (150 m² donnent 115 millions) et les deux petits dessins montrent bien les boutons ; mais les ventes, les « exemples » auxquels la droite est ajustée, ne sont jamais montrées ni décrites, si bien que « ajuster aux exemples » reste abstrait."}
    enchainement: {note: 9, raison: "Chaque page répond à la question de la précédente (« Que fait chaque bouton ? », « Qui tourne les boutons ? ») ; seul l'encadré de la page 3 annonce un « calcul » qui donne 74 et 4 avant que le lecteur sache qui le fait."}
    retenu: {note: 9, raison: "« Si seul $b$ change, que fait la droite ? » se résout d'un coup d'œil au titre de la page 3 ; le premier point à retenir n'est qu'une formule, que le lecteur ne sait pas redire en mots."}
  blocages:
  - endroit: "page 2, texte"
    passage: "La régression linéaire prédit le prix $ŷ$ par une droite, selon la seule surface $x$ ; le chapeau marque une prédiction. Deux boutons, $a$ et $b$, la règlent."
    pourquoi: "Le lecteur rencontre $ŷ$ avant de savoir que c'est le prix prédit, et « la règlent » se rapporte à une droite citée une ligne plus haut : il faut relire la phrase pour remettre chaque symbole à sa place."
    proposition: "Une droite prédit le prix selon la seule surface $x$ : c'est la régression linéaire. Le prix prédit se note $ŷ$ : le chapeau marque une prédiction. Deux boutons, $a$ et $b$, règlent la droite."
  - endroit: "page 2, graphique, étiquette de la droite"
    passage: "$ŷ = a·x + b$"
    pourquoi: "Le lecteur ne sait plus qu'un point entre deux lettres veut dire « fois » : l'équation reste une suite de signes, alors que tout l'épisode repose sur elle."
    proposition: "$ŷ = a·x + b$, soit $a$ fois $x$, plus $b$"
  - endroit: "page 2, graphique, étiquette de a"
    passage: "$a$ = 74 : l'inclinaison"
    pourquoi: "Le petit « 1 » sous le pointillé et le trait bleu vertical forment un triangle que le lecteur ne sait pas lire : rien ne dit qu'un pas de 1, soit 100 m², fait monter la droite de 74."
    proposition: "$a$ = 74 : l'inclinaison, la montée pour un pas de 1 (100 m²)"
  - endroit: "page 3, encadré"
    passage: "Sur les ventes d'Ames, ville des États-Unis, de 2006 à 2010, le calcul donne $a$ = 74 et $b$ = 4"
    pourquoi: "« Le calcul » ne renvoie à rien : le lecteur ne sait pas encore que c'est l'entraînement, expliqué à la page suivante, qui trouve ces deux nombres."
    proposition: "Sur les ventes d'Ames, ville des États-Unis, de 2006 à 2010, l'entraînement, expliqué à la page suivante, donne $a$ = 74 et $b$ = 4 : 100 m² de plus ajoutent 74 millions de FCFA au prix prédit."
  - endroit: "page 4, texte"
    passage: "Ces deux nombres sont ses paramètres, ce qu'il a appris des exemples. On les désigne souvent ensemble par la lettre grecque $θ$ (thêta)."
    pourquoi: "La lettre $θ$ ajoute une cinquième notion à un paragraphe déjà chargé, et la ligne 01 la répète aussitôt : il suffit de la présenter une fois, dans la ligne 01."
    proposition: "Qui tourne les boutons ? C'est le rôle de l'entraînement. La forme, une droite, est choisie d'avance ; le modèle ajuste ensuite $a$ et $b$ aux exemples. Ces deux nombres sont ses paramètres, ce qu'il a appris des exemples."
  - endroit: "page 4, ligne 01"
    passage: "Ici, les paramètres $θ$ sont les deux nombres $a$ et $b$."
    pourquoi: "Si la lettre $θ$ quitte le texte, c'est ici qu'elle doit être expliquée, en mots, à sa seule apparition sur la page."
    proposition: "Ici, les paramètres sont les deux nombres $a$ et $b$ ; on les désigne souvent ensemble par la lettre grecque $θ$ (thêta)."
  - endroit: "page 4, ligne 02"
    passage: "Ils sont calculés pendant l'entraînement, à partir des exemples."
    pourquoi: "Les exemples n'ont été montrés nulle part : le graphique de la page 2 ne contient aucune vente, et le lecteur ne voit pas à quoi la droite est ajustée."
    proposition: "Ils sont calculés pendant l'entraînement, à partir des exemples : les 2 925 ventes d'Ames, chacune avec sa surface et son prix de vente."
  - endroit: "page 5, point 01"
    passage: "$ŷ$ = $a$·$x$ + $b$ : deux réglages, $a$ et $b$."
    pourquoi: "Le premier point à retenir est une formule seule : après une lecture, le lecteur ne sait pas la redire en une phrase."
    proposition: "Le prix prédit $ŷ$ vaut $a$ fois la surface $x$, plus $b$ : deux réglages, $a$ et $b$."
post:
  criteres:
    accroche: {note: 9, raison: "Le contraste 2 925 ventes contre deux nombres intrigue et se comprend ; « en entrée » et « en sortie » ne disent pas de quoi, et il faut la longue troisième ligne pour l'apprendre."}
    vocabulaire: {note: 8.5, raison: "Entraînement et réseau de neurones sont expliqués ; le sigle BCEAO et le mot « cours » restent sans explication (le lecteur ignore que les prix ont été convertis de dollars), et « ce modèle » surgit sans que la droite ait été appelée un modèle."}
    message: {note: 9, raison: "On retient qu'un modèle est une forme choisie d'avance plus des nombres appris ; la dernière phrase, sur le résumé, ajoute une seconde idée au lieu de conclure la première."}
    fil: {note: 8.5, raison: "Le paragraphe sur le réseau de neurones coupe le fil entre les deux parties du modèle et le sens de 74 et 4 ; puis « Que fait chacun de ces nombres ? » arrive juste après qu'on a dit ce que chacun vaut, ce qui déroute."}
  blocages:
  - endroit: "lignes 1 et 2"
    passage: "2 925 ventes de maisons (2006 à 2010) en entrée.\nDeux nombres en sortie : 74 et 4."
    pourquoi: "« En entrée » de quoi ? Le lecteur ne sait pas encore qu'il s'agit d'un calcul, et doit attendre la troisième ligne."
    proposition: "2 925 ventes de maisons (2006 à 2010) en entrée d'un calcul.\nDeux nombres en sortie : 74 et 4."
  - endroit: "paragraphe 2"
    passage: "Ce modèle se lit en deux parties :"
    pourquoi: "Le lecteur qui n'a vu aucun épisode ne sait pas que la droite est un « modèle » : le mot arrive sans lien avec ce qui précède."
    proposition: "Cette droite est un modèle : un calcul tiré d'exemples, qui prédit. Il se lit en deux parties :"
  - endroit: "paragraphe 5"
    passage: "(cours BCEAO du 27 octobre 2026)"
    pourquoi: "BCEAO est un sigle non expliqué, et « cours » suppose de savoir que les prix d'Ames, en dollars, ont été convertis en FCFA."
    proposition: "(prix convertis des dollars en FCFA au cours du 27 octobre 2026 de la BCEAO, la Banque centrale des États de l'Afrique de l'Ouest)"
  - endroit: "paragraphes 4 à 6"
    passage: "Un réseau de neurones, modèle bien plus complexe qu'une droite, se lit de la même façon : une forme choisie d'avance, des paramètres appris, seulement bien plus nombreux."
    pourquoi: "Placé entre les deux parties du modèle et le sens de 74 et 4, ce paragraphe fait un détour ; la question qui suit, posée juste après l'explication des deux nombres, semble déjà résolue."
    proposition: "Le premier, 74 : chaque 100 m² de plus ajoute 74 millions de FCFA au prix prédit (cours BCEAO du 27 octobre 2026). Le second réserve une surprise : c'est le prix prédit pour une maison de 0 m², qui n'existe pas. C'est un point de départ du calcul, pas une vente.\n\nUn réseau de neurones, modèle bien plus complexe qu'une droite, se lit de la même façon : une forme choisie d'avance, des paramètres appris, seulement bien plus nombreux.\n\nEt si l'on change 74 ou 4, que devient la droite ? La réponse est dans les pages."
  - endroit: "dernier paragraphe"
    passage: "Ce modèle ne garde aucune vente, seulement un résumé, qui laisse des détails de côté."
    pourquoi: "La phrase finale lance l'idée de résumé sans la relier à la forme et aux deux nombres : le lecteur termine sur une seconde idée au lieu de celle qu'il vient d'apprendre."
    proposition: "Ce modèle ne garde aucune vente, seulement une forme et deux nombres : un résumé, qui laisse des détails de côté."
