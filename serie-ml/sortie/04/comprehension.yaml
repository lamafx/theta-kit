episode: 4
lecteur: "Professionnel curieux, niveau bac, sans informatique ni mathématiques après le lycée, qui ne se souvient que des pages « À retenir » des Nº 01 à 03 ; pour le post, la même personne qui le découvre seule dans son fil LinkedIn, sans avoir vu aucun épisode."
carrousel:
  criteres:
    premier_abord: {note: 7, raison: "La couverture et son robot au bouton parlent vite, mais l'ouverture serre en une phrase la régression linéaire, deux symboles ($ŷ$, $x$), une équation et l'ajustement aux données, sans dire pourquoi cela compte : il faut la relire."}
    vocabulaire: {note: 7, raison: "Le chapeau de $ŷ$ n'est jamais expliqué (il faut deviner qu'il s'agit du prix prédit), et « fonction », « ordonnée à l'origine », « Ames » et « à $b$ fixe » restent sans explication en mots simples."}
    une_notion_par_page: {note: 7, raison: "La page 4 pose quatre idées (entraînement, forme choisie d'avance, paramètres notés $θ$, critère d'écart) et plusieurs phrases sont télégraphiques (« Les paramètres $θ$ : ici $a$ et $b$. », « Mêmes axes, même droite de départ, en gris. »)."}
    concret: {note: 8.5, raison: "La droite des prix (150 m² donnent 115 millions) et les deux dessins pivot et décalage montrent bien les boutons ; la page 4, sur l'entraînement et l'écart, reste sans exemple ni visuel."}
    enchainement: {note: 8.5, raison: "La page 3 répond à la question laissée par la page 2 (« Que fait chaque bouton ? ») ; le passage à la page 4 se fait par un renvoi aux « règles » de l'épisode 01, que le lecteur associe aux règles écrites à la main du programme classique."}
    retenu: {note: 9, raison: "« Si seul $b$ change, que fait la droite ? » se résout d'un coup d'œil à la page 3 ; la troisième idée à retenir, « selon l'écart aux résultats réels », demande un petit effort."}
  blocages:
  - endroit: "page 1, couverture, sous-titre"
    passage: "Un modèle, c'est une fonction avec des boutons de réglage."
    pourquoi: "« Fonction » est un mot de mathématiques que le lecteur a oublié depuis le lycée, et la couverture ne dit pas pourquoi ces boutons comptent."
    proposition: "Un modèle est une règle de calcul munie de boutons ; apprendre, c'est les régler sur des exemples."
  - endroit: "page 2, texte"
    passage: "La régression linéaire prédit le prix $ŷ$ selon la seule surface $x$ : la droite $ŷ$ = $a$·$x$ + $b$. $a$ et $b$ s'ajustent aux données, comme des boutons."
    pourquoi: "Trois notions et une équation dans une phrase ; le chapeau de $ŷ$ n'est pas expliqué, alors que la page 4 repose sur la différence entre prix prédit et prix réel. L'équation reste lisible sur le graphique, et l'ajustement aux exemples est dit à la page 4."
    proposition: "La régression linéaire trace une droite qui prédit le prix, noté $ŷ$, selon la seule surface $x$. Le chapeau marque une prédiction. Deux boutons, $a$ et $b$, règlent la droite."
  - endroit: "page 2, graphique, étiquette de b"
    passage: "$b$ = 4 : l'ordonnée à l'origine"
    pourquoi: "« Ordonnée à l'origine » est un terme de lycée que le lecteur ne sait plus relier au point bleu sur l'axe vertical."
    proposition: "$b$ = 4 : la hauteur de départ (ordonnée à l'origine)"
  - endroit: "page 3, texte"
    passage: "Le premier, $a$, à $b$ fixe, fait tourner la droite autour de son point sur l'axe vertical. Le second, $b$, la fait monter ou descendre sans la tourner. Mêmes axes, même droite de départ, en gris."
    pourquoi: "« À $b$ fixe » est une tournure de mathématicien, et la dernière phrase est télégraphique : on ne comprend qu'au second coup d'œil que la droite grise est celle d'avant le changement."
    proposition: "Que fait chaque bouton ? Quand on change $a$ sans toucher à $b$, la droite tourne autour de son point sur l'axe vertical. Quand on change $b$, elle monte ou descend sans tourner. Sur les deux dessins, la droite de départ est en gris."
  - endroit: "page 3, encadré"
    passage: "Sur les ventes d'Ames de 2006 à 2010"
    pourquoi: "Le lecteur ne sait pas ce qu'est Ames : un nom propre sans explication."
    proposition: "Sur les ventes de maisons d'Ames, une ville des États-Unis, de 2006 à 2010, le calcul donne $a$ = 74 et $b$ = 4 : chaque centaine de m² ajoute 74 millions de FCFA au prix prédit."
  - endroit: "page 4, texte"
    passage: "Les règles que le modèle tire des exemples (épisode 01) tiennent ici en deux nombres, $a$ et $b$ ; la forme, une droite, est choisie d'avance. Pendant l'entraînement, le modèle les ajuste aux exemples. Ces réglages sont ses paramètres ; on les note souvent ensemble $θ$."
    pourquoi: "Quatre idées dans un paragraphe ; « règles » rappelle au lecteur les règles écrites à la main de l'épisode 01, et le lien avec les boutons de la page 3 n'est pas dit."
    proposition: "Qui tourne les boutons ? C'est le rôle de l'entraînement. La forme, une droite, est choisie d'avance ; le modèle ajuste ensuite $a$ et $b$ aux exemples. Ces deux nombres sont ses paramètres, ce qu'il a appris des exemples. On les désigne souvent ensemble par la lettre grecque $θ$ (thêta)."
  - endroit: "page 4, ligne 01"
    passage: "Les paramètres $θ$ : ici $a$ et $b$."
    pourquoi: "Phrase télégraphique."
    proposition: "Ici, les paramètres $θ$ sont les deux nombres $a$ et $b$."
  - endroit: "page 4, ligne 03"
    passage: "Meilleurs selon un critère : l'écart entre prédictions et résultats réels, à réduire ; il faut d'abord le mesurer."
    pourquoi: "Phrase télégraphique et abstraite : le lecteur ne voit pas de quel écart il s'agit, faute d'exemple tiré des maisons."
    proposition: "« Meilleurs » dépend d'un critère : pour chaque maison vendue, l'écart entre le prix prédit par la droite et le vrai prix de vente doit être petit. Il faut donc d'abord mesurer cet écart."
  - endroit: "page 5, point 03"
    passage: "Entraîner, c'est chercher les meilleurs réglages, selon l'écart aux résultats réels."
    pourquoi: "« Selon l'écart aux résultats réels » est elliptique : le lecteur doit reconstituer ce qui est comparé."
    proposition: "Entraîner, c'est chercher les réglages qui rendent petit l'écart entre prix prédits et prix réels."
post:
  criteres:
    accroche: {note: 8.5, raison: "« 2 925 ventes en entrée, deux nombres en sortie » intrigue et se comprend ; la troisième ligne (« une droite ajustée sur les ventes d'Ames ») perd le lecteur, qui ne sait ni ce qu'est Ames ni ce que la droite relie."}
    vocabulaire: {note: 7, raison: "« Droite ajustée », « entraînement », « réseau de neurones » et « survit au changement d'échelle » restent sans explication en mots simples."}
    message: {note: 8.5, raison: "On retient qu'un modèle est une forme choisie plus des nombres appris ; mais le post ne dit jamais ce que signifie 74, ni que la droite relie la surface au prix."}
    fil: {note: 7, raison: "Le paragraphe sur le réseau de neurones fait un détour, « survit au changement d'échelle » et la dernière phrase (« avec ce que tout résumé laisse de côté ») demandent une relecture."}
  blocages:
  - endroit: "paragraphe 2"
    passage: "C'est tout ce que garde une droite ajustée sur les ventes d'Ames."
    pourquoi: "Le lecteur ne sait pas ce qu'est Ames, ni ce que veut dire « ajustée », ni que la droite sert à prédire un prix selon une surface."
    proposition: "C'est tout ce que garde une droite tracée au plus près de ces ventes, pour prédire le prix d'une maison selon sa surface. Les ventes viennent d'Ames, une ville des États-Unis."
  - endroit: "paragraphe 3"
    passage: "Ce choix précède l'entraînement."
    pourquoi: "« Entraînement » n'est pas expliqué pour un lecteur qui n'a vu aucun épisode."
    proposition: "Ce choix est fait avant l'entraînement, la phase où le modèle apprend à partir des exemples."
  - endroit: "paragraphe 4"
    passage: "Cette séparation survit au changement d'échelle. Un réseau de neurones a lui aussi une forme choisie d'avance et des paramètres appris, seulement bien plus nombreux."
    pourquoi: "« Changement d'échelle » fait penser aux axes d'un graphique ; « réseau de neurones » n'est pas expliqué ; il faut relire pour comprendre qu'on parle de modèles plus grands."
    proposition: "Cette séparation vaut aussi pour des modèles bien plus grands. Un réseau de neurones, un modèle bien plus complexe qu'une droite, a lui aussi une forme choisie d'avance et des paramètres appris, seulement bien plus nombreux."
  - endroit: "paragraphe 5"
    passage: "Le second nombre réserve une surprise : c'est le prix prédit pour une maison de 0 m²."
    pourquoi: "Le post explique le second nombre mais jamais le premier : le lecteur ne peut pas dire ce que vaut 74, donc ce qu'il a appris reste flou."
    proposition: "Le premier nombre, 74, dit de combien de millions de FCFA monte le prix prédit quand la surface grandit de 100 m². Le second réserve une surprise : c'est le prix prédit pour une maison de 0 m²."
  - endroit: "dernier paragraphe"
    passage: "Ce modèle ne garde aucune vente. Il en garde un résumé, avec ce que tout résumé laisse de côté."
    pourquoi: "La tournure « avec ce que tout résumé laisse de côté » est à relire : on ne sait pas si le résumé garde ou perd quelque chose."
    proposition: "Ce modèle ne garde aucune vente. Il en garde un résumé en deux nombres, et, comme tout résumé, il laisse des détails de côté."
