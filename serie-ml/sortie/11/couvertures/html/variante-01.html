@page{size:1080px 1350px;margin:0}
body{margin:0;background:#FFFFFF}
.page{--accent:#2D5BFF;width:1080px;height:1350px;box-sizing:border-box;padding:72px 80px 56px;background:#FFFFFF;color:#0E1116;font-family:'Geist',sans-serif;display:flex;flex-direction:column;overflow:hidden}
/* Un bloc trop haut ne rétrécit pas les autres (un visuel serait écrasé) : il pousse le pied, que le contrôle de débordement voit. */
.page > *{flex-shrink:0}
.accent{color:var(--accent)}
.m{font-family:'STIX Two Text',serif}
.it{font-style:italic}
strong{font-weight:600}

/* En-tête et pied de page */
.entete{display:flex;justify-content:space-between;align-items:center;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase}
.entete .gauche{display:flex;gap:14px}
.entete .numero{color:var(--accent)}
.entete .chapitre,.entete .pagination{color:#5F6673}
.pied{margin-top:auto;padding-top:22px;border-top:1px solid #E4E6EA;display:flex;justify-content:space-between;align-items:center}
.pied .signature{font-size:24px;font-weight:500;color:#0E1116}
.glissez{display:flex;align-items:center;gap:12px}
.glissez span{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#5F6673}

/* Pages de contenu */
.role{margin-top:64px;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
.titre-page{margin:16px 0 0;font-size:60px;line-height:1.06;font-weight:600;letter-spacing:-0.03em;color:#0E1116}
.texte{margin:24px 0 0;max-width:880px;font-size:30px;line-height:1.45;color:#3E4450}

/* Couverture et couverture de bilan */
.page.sombre{--accent:#4C8DFF;background:#0A0F17;color:#F5F8FC}
.sombre .entete{position:relative;z-index:2}
.sombre .entete .chapitre{color:#8A97A8}
.serie{display:flex;align-items:baseline;gap:10px;color:#8A97A8}
.serie .theta{font-family:'STIX Two Text',serif;font-style:italic;font-size:24px;letter-spacing:0;text-transform:none;color:var(--accent)}
.scene{position:relative;width:920px;height:700px;flex-shrink:0}
.robot-couverture{position:absolute;left:160px;top:60px;display:block}
.titre-couverture{position:relative;z-index:2;margin:8px 0 0;font-size:108px;line-height:0.95;font-weight:600;letter-spacing:-0.035em;color:#F5F8FC}
.accroche{margin:26px 0 0;max-width:780px;font-size:30px;line-height:1.38;color:#A7B3C2}
/* Couverture d'épisode (2026-10-26, design/propositions/couverture-n01.html) : scène plus basse, robot réduit à 95 %, titre 92 px */
.scene-couverture-ep{height:640px}
.scene-couverture-ep .robot-couverture{left:175px;top:32px;width:570px;height:608px}
.titre-couverture-ep{margin-top:12px;font-size:92px;line-height:0.98}
.accroche-couverture-ep{margin-top:28px;max-width:820px}
/* Couverture A (session de design n° 2, 2026-11-01, theta-maj-visuels) : robot en buste qui joue le sujet ; le motif
   de la famille dans la zone que son bras atteint ; titre en bas, ou en haut quand le robot occupe le bas. */
.page-couverture-a{position:relative}
.scene-a{position:absolute;left:0;top:0;width:1080px;height:1350px;z-index:0}
.motif-a{position:absolute;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent),linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
.motif-a > svg{position:absolute !important;left:50% !important;top:50% !important;transform:translate(-50%,-50%)}
.robot-a{position:absolute;left:0;top:0;display:block}
.bloc-titre-a{position:relative;z-index:2;margin-top:auto;display:flex;flex-direction:column}
.bloc-titre-a.en-haut{margin-top:64px}
.titre-couverture-a{margin:0;font-size:124px;line-height:0.93;font-weight:600;letter-spacing:-0.04em;color:#F5F8FC;max-width:760px}
.titre-couverture-a.long{font-size:96px;line-height:0.96}
.accroche-a{margin:28px 0 0;max-width:720px;font-size:32px;line-height:1.35;color:#A7B3C2}
.pied-a{position:relative;z-index:2;margin-top:48px}
.pied-a.en-bas{margin-top:auto}
.pied-a.etroit{width:420px}
.pied-a .pied{margin-top:0}
.sombre .pied{border-top-color:#1E2938}
.sombre .pied .signature{color:#F5F8FC}
.sombre .glissez span{color:#8A97A8}

/* Ouverture */
.rappel{margin-top:52px;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.08em;color:#5F6673}
.grand-titre{margin:22px 0 0;font-size:108px;line-height:0.95;font-weight:600;letter-spacing:-0.035em;color:#0E1116}
.intuition{margin:28px 0 0;max-width:820px;font-size:30px;line-height:1.42;font-weight:400;color:#3E4450}
.visuel-ouverture{--marge-flux:0px;margin-top:40px;display:flex;flex-direction:column;gap:6px}
.legende{font-family:'Geist Mono',monospace;font-size:22px;letter-spacing:0.04em;color:#5F6673;padding-left:40px}

/* Mécanisme */
.encadres{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;border-top:1px solid #E4E6EA;padding-top:28px}
.encadre{display:flex;flex-direction:column;gap:8px}
.encadre .titre-encadre{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#5F6673}
.encadre .texte-encadre{font-size:24px;line-height:1.35;color:#0E1116}

/* Comparaison */
.cas-grille{margin-top:48px;display:grid;grid-template-columns:repeat(var(--nb-cas),minmax(0,1fr));gap:40px}
.cas{display:flex;flex-direction:column;gap:14px;border-top:2px solid #E4E6EA;padding-top:18px}
.cas .cas-etiquette{font-family:'STIX Two Text',serif;font-size:26px;color:#0E1116}
.cas .cas-titre{font-size:26px;font-weight:600;color:#5F6673}
.cas .cas-texte{font-size:22px;line-height:1.4;color:#3E4450}
.cas.retenu{border-top-color:var(--accent)}
.cas.retenu .cas-titre{color:var(--accent)}
.cas.alerte{border-top-color:#C2410C}
.cas.alerte .cas-titre{color:#C2410C}
.pratique{margin-top:auto;margin-bottom:28px;background:#F4F6FA;border-radius:20px;padding:26px 32px;display:flex;flex-direction:column;gap:8px}
.pratique span.titre-encadre{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
.pratique p{margin:0;font-size:24px;line-height:1.4;color:#0E1116}
.pratique + .pied{margin-top:0}

/* Formule */
.panneau{margin-top:52px;background:#F4F6FA;border-radius:24px;padding:64px 40px;display:flex;justify-content:center}
.panneau .formule{font-family:'STIX Two Text','Times New Roman',serif;font-size:76px;line-height:1;color:#0E1116;white-space:nowrap}
.panneau .formule sub{font-size:0.58em;vertical-align:-0.34em;line-height:0}
.panneau .formule .op{padding:0 0.26em}
.panneau .formule .nabla{padding-left:0.1em}
/* Fraction empilée et grands opérateurs (Σ, Π), comme dans un texte de mathématiques */
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;font-size:0.74em;line-height:1.05;margin:0 0.14em}
.frac .num{padding:0 0.18em 0.08em;border-bottom:0.055em solid currentColor}
.frac .den{padding:0.08em 0.18em 0}
.grand{font-style:normal;font-size:1.25em;vertical-align:-0.06em;padding:0 0.06em}
.panneau .phrase{font-size:38px;line-height:1.25;font-weight:500;letter-spacing:-0.015em;color:#0E1116;text-align:center}
.lignes{margin-top:44px;display:flex;flex-direction:column}
.ligne{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:baseline;padding:22px 0;border-top:1px solid #E4E6EA}
.ligne:last-child{border-bottom:1px solid #E4E6EA}
.ligne .symbole{font-family:'STIX Two Text',serif;font-size:36px;color:#0E1116}
.ligne .symbole.accent{color:var(--accent)}
.ligne .symbole sub{font-size:0.62em;vertical-align:-0.3em;line-height:0}
.ligne .numero-ligne{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;color:var(--accent)}
.ligne .sens{font-size:24px;line-height:1.4;color:#3E4450}

/* Exemple chiffré */
.tableau{margin-top:40px;width:100%;border-collapse:collapse;font-size:24px;font-variant-numeric:tabular-nums}
.tableau thead tr{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.06em;text-transform:none;color:#5F6673}
.tableau th{text-align:right;padding:0 0 14px;font-weight:500}
.tableau th:first-child{text-align:left}
.tableau tbody tr{border-top:1px solid #E4E6EA}
.tableau tbody tr:last-child{border-bottom:1px solid #E4E6EA}
.tableau td{padding:18px 0;text-align:right}
.tableau td:first-child{text-align:left;color:#5F6673}
.tableau td.accent{color:var(--accent)}
.tableau td.gras{font-weight:600}
.conclusion{margin:28px 0 0;font-size:24px;line-height:1.4;color:#0E1116}

/* Piège */
.page-piege .role{color:#C2410C}
.alerte-encadre{margin-top:40px;border-top:2px solid #C2410C;padding-top:24px;display:flex;flex-direction:column;gap:10px}
.alerte-encadre span{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#C2410C}
.alerte-encadre p{margin:0;font-size:26px;line-height:1.4;color:#0E1116}

/* Images réelles : contexte et capture */
.figure{margin:40px 0 0;display:flex;flex-direction:column;gap:14px}
.photo{position:relative;width:920px;height:430px;border-radius:20px;overflow:hidden;border:1px solid #E4E6EA;background:#EEF1F5}
/* Traitement de la charte (regles-redaction.md) : noir et blanc, contraste, recadrage au centre. */
.image-reelle{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:grayscale(1) contrast(1.08)}
.capture .image-reelle{object-position:top left;filter:grayscale(1) contrast(1.04)}
.voile{position:absolute;inset:0;background:var(--accent);opacity:0.08;mix-blend-mode:multiply;pointer-events:none}
.figure figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.legende-image{font-size:22px;line-height:1.4;color:#3E4450}
/* Crédit sur une ligne s'il tient (comme le canevas), sinon sur plusieurs, aligné à droite. */
.credit{flex-shrink:0;max-width:500px;text-align:right;font-family:'Geist Mono',monospace;font-size:22px;letter-spacing:0.06em;color:#5F6673}
/* Contexte sans image : le texte prend la place de la photo, dans le même cadre ; la frise des repères s'agrandit. */
.a-la-place{margin-top:40px;width:920px;height:430px;box-sizing:border-box;border-radius:20px;background:#F4F6FA;padding:48px 64px;display:flex;align-items:center}
.a-la-place p{margin:0;font-size:34px;line-height:1.42;color:#0E1116}
.frise{margin-top:56px;position:relative;display:grid;grid-template-columns:repeat(var(--nb-reperes),minmax(0,1fr));gap:40px;padding-top:44px}
.frise::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:#E4E6EA}
.jalon{position:relative;display:flex;flex-direction:column;gap:10px}
.jalon::before{content:"";position:absolute;left:0;top:-44px;width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:3px solid var(--accent);background:#FFFFFF}
.jalon .date{font-family:'Geist Mono',monospace;font-size:40px;font-weight:500;line-height:1;color:var(--accent)}
.jalon .fait{font-size:26px;line-height:1.35;color:#0E1116}
.reperes{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;border-top:1px solid #E4E6EA;padding-top:24px}
.repere{display:flex;flex-direction:column;gap:6px}
.repere .date{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;color:var(--accent)}
.repere .fait{font-size:22px;line-height:1.35;color:#0E1116}
.schema{width:920px;box-sizing:border-box;border-radius:20px;border:1px solid #E4E6EA;background:#F4F6FA;padding:36px 0;display:flex;justify-content:center}
.page-capture .avec-capture{flex:1 1 auto;margin-bottom:48px}
.avec-capture .capture{flex:1 1 auto;display:flex;flex-direction:column}
.capture{width:920px;border-radius:20px;overflow:hidden;border:1px solid #E4E6EA;background:#FFFFFF}
.capture .barre{height:44px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;gap:8px;background:#F4F6FA;border-bottom:1px solid #E4E6EA}
.capture .barre .point{width:10px;height:10px;border-radius:5px;background:#D5DCE6}
.capture .barre .fenetre{margin-left:14px;font-family:'Geist Mono',monospace;font-size:22px;letter-spacing:0.06em;color:#5F6673}
.capture .ecran{position:relative;flex:1 1 auto;min-height:430px;background:#EEF1F5}
.capture .surlignage{position:absolute;left:24px;right:24px;box-sizing:border-box;border:2.5px solid var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;pointer-events:none}
.capture .badge{background:var(--accent);color:#FFFFFF;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px}

/* Fin */
.page.page-fin{--accent:#2D5BFF;background:#EEF2F8;color:#0E1116;position:relative}
.page-fin .entete .chapitre,.page-fin .entete .pagination{color:#5F6673}
.a-retenir{margin-top:72px;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
.points{margin:36px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:40px;max-width:900px}
.points li{display:flex;gap:28px;align-items:baseline}
.points .numero-point{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;color:var(--accent);min-width:36px}
.points .point{font-size:38px;line-height:1.25;font-weight:500;letter-spacing:-0.015em;color:#0E1116}
.verifiez{margin-top:auto;max-width:380px;box-sizing:border-box;background:#FFFFFF;border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.verifiez .etiquette-verifiez{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
.verifiez .question{font-size:24px;line-height:1.35;font-weight:500;color:#0E1116}
.verifiez .reponse{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#5F6673}
.suivant{margin-top:auto;margin-bottom:40px;max-width:380px;display:flex;flex-direction:column;gap:10px}
.suivant .etiquette-suivant{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#5F6673}
.suivant .titre-suivant{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#0E1116}
.suivant .transition{font-size:22px;line-height:1.35;font-weight:500;color:#0E1116}
.verifiez + .suivant{margin-top:36px}
.suivant .saisons{margin:6px 0 4px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.suivant .saisons li{display:flex;gap:16px;align-items:baseline;font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.06em}
.suivant .saisons .saison{min-width:96px;color:var(--accent)}
.suivant .saisons .episodes{color:#3E4450}
.reprise{margin:28px 0 0;max-width:900px;font-size:52px;line-height:1.1;font-weight:600;letter-spacing:-0.03em;color:#0E1116}
.lignes-reprise{margin-top:40px;gap:22px}
.lignes-reprise .point{font-size:32px}
.suivant .invitation{font-size:22px;line-height:1.4;color:#3E4450}
.page-fin .pied{position:relative;z-index:2;margin-top:0;border-top-color:#D5DCE6;justify-content:flex-start}
.page-fin .pied .signature{color:#0E1116}
.robot-baguette{position:absolute;left:380px;top:726px;display:block}

/* Bilan de saison : sommaire */
.texte-sommaire{margin:22px 0 0;max-width:880px;font-size:24px;line-height:1.45;color:#3E4450}
.sommaire{margin-top:44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}
.colonne{display:flex;flex-direction:column;gap:32px}
.chapitre-bilan{display:flex;flex-direction:column}
.chapitre-bilan .nom-chapitre{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#5F6673;padding-bottom:10px;border-bottom:2px solid #0E1116}
.chapitre-bilan .episode{display:flex;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid #E4E6EA}
.chapitre-bilan .numero-episode{font-family:'Geist Mono',monospace;font-size:22px;font-weight:500;color:var(--accent);min-width:28px}
.chapitre-bilan .titre-episode{font-size:22px;line-height:1.3}
