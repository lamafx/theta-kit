  dérivée: [dériver, dérivées]
  tangente: [tangentes]
  pente: [pentes]
  dérivée partielle: [dérivées partielles]
  gradient ∇J: [gradients]
  taux d'apprentissage η: [taux d’apprentissage]
  itération: [itérations, itérer]
  convergence: [converge, convergent, converger, convergé]
  oscillation: [oscille, oscillent, osciller, oscillations]
  divergence: [diverge, divergent, diverger, divergé, divergences]
  descente stochastique (SGD): [stochastique]
  mini-lot: [mini-lots]
  époque: [époques]
  fonction convexe: [convexe, convexes]
  normalisation: [normaliser, normalisé, normalisées, normalisés]
  standardisation: [standardiser, standardisé]
  polynôme: [polynomiale, polynomial]
  sigmoïde σ: [sigmoïdes]
