<!doctype html>
<html lang="fr">

<title>Page F · piège, robot en note</title>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}

<body>

<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 72px 80px 56px; background: #FFFFFF; color: #0E1116; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">
<span style="display: flex; gap: 14px"><span style="color: #C2410C">Nº 08</span><span style="color: #5F6673">Piège</span></span>
<span style="color: #5F6673">7 / 8</span>
</div>

<h2 style="margin: 56px 0 0; font-size: 60px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; color: #0E1116"><span style="font-family: 'STIX Two Text', serif; font-style: italic; font-weight: 400">η</span> trop grand :<br>le modèle diverge.</h2>
<p style="margin: 22px 0 0; max-width: 900px; font-size: 30px; line-height: 1.4; color: #3E4450">Même courbe, même départ, mais <span style="font-family: 'STIX Two Text', serif; font-style: italic">η</span> = 1,1. Chaque pas saute par-dessus le minimum et atterrit plus haut.</p>

<svg viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Courbe J(θ) = θ². Avec η = 1,1, depuis θ = −3, les pas alternent de part et d'autre du minimum en s'éloignant : θ passe à 3,6 puis −4,32 puis 5,18, et l'erreur monte de 9 à 12,96, 18,66 puis 26,87." style="margin-top: 32px; display: block">
<defs>
<marker id="f-step" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2410C"></path></marker>
</defs>
<line x1="20" y1="410" x2="900" y2="410" stroke="#E4E6EA" stroke-width="2"></line>
<path d="M40 32 Q460 788 880 32" fill="none" stroke="#0E1116" stroke-width="3.5" stroke-linecap="round"></path>
<circle cx="460" cy="410" r="7" fill="#FFFFFF" stroke="#0E1116" stroke-width="2.5"></circle>
<g stroke="#C2410C" stroke-width="3" fill="none">
<line x1="258" y1="314" x2="700" y2="276" marker-end="url(#f-step)"></line>
<line x1="704" y1="280" x2="170" y2="216" marker-end="url(#f-step)"></line>
<line x1="164" y1="210" x2="810" y2="131" marker-end="url(#f-step)"></line>
</g>
<circle cx="250" cy="315.5" r="9" fill="#FFFFFF" stroke="#0E1116" stroke-width="3.5"></circle>
<circle cx="712" cy="273.9" r="7" fill="#C2410C"></circle>
<circle cx="157.6" cy="214" r="7" fill="#C2410C"></circle>
<circle cx="822.9" cy="127.8" r="7" fill="#C2410C"></circle>
<g font-family="Geist Mono, monospace" font-size="22" font-weight="500">
<text x="238" y="356" text-anchor="end" fill="#0E1116">J = 9</text>
<text x="732" y="314" fill="#C2410C">12,96</text>
<text x="140" y="196" text-anchor="end" fill="#C2410C">18,66</text>
<text x="808" y="100" text-anchor="end" fill="#C2410C">26,87</text>
</g>
<text x="460" y="450" text-anchor="middle" font-family="Geist, sans-serif" font-size="21" font-weight="500" fill="#0E1116">minimum</text>
<text x="40" y="450" font-family="STIX Two Text, serif" font-style="italic" font-size="24" fill="#3E4450">J(θ) = θ²</text>
</svg>

<div style="margin-top: auto; margin-bottom: 36px; display: flex; align-items: center; gap: 28px; background: #EEF2F8; border-radius: 28px; padding: 28px 36px 28px 28px">
<svg viewBox="-30 15 460 365" width="150" height="119" role="img" aria-label="Le robot de la série, en petit, qui donne le conseil." style="display: block; flex-shrink: 0">
<defs>
<radialGradient id="f-shell" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.55" stop-color="#E4E9EF"></stop><stop offset="1" stop-color="#97A3B2"></stop></radialGradient>
<linearGradient id="f-visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2735"></stop><stop offset="1" stop-color="#04070B"></stop></linearGradient>
<linearGradient id="f-bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D3A1"></stop><stop offset="0.5" stop-color="#C08A52"></stop><stop offset="1" stop-color="#7E532C"></stop></linearGradient>
<radialGradient id="f-disc" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#A3AEBB"></stop></radialGradient>
<filter id="f-glow" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
<path d="M50 214 C50 22 350 22 350 214" fill="none" stroke="#262E39" stroke-width="22" stroke-linecap="round"></path>
<ellipse cx="200" cy="230" rx="165" ry="150" fill="url(#f-shell)"></ellipse>
<ellipse cx="200" cy="230" rx="165" ry="150" fill="none" stroke="#8DB8FF" stroke-opacity="0.5" stroke-width="2"></ellipse>
<rect x="82" y="180" width="236" height="140" rx="70" fill="url(#f-visor)"></rect>
<g fill="none" stroke="#9CC6FF" stroke-width="10" stroke-linecap="round" filter="url(#f-glow)">
<path d="M136 262 L164 248"></path>
<path d="M264 248 L292 262"></path>
</g>
<circle cx="32" cy="245" r="58" fill="url(#f-shell)"></circle>
<circle cx="32" cy="245" r="44" fill="none" stroke="url(#f-bronze)" stroke-width="9"></circle>
<circle cx="32" cy="245" r="35" fill="url(#f-disc)"></circle>
<circle cx="368" cy="245" r="58" fill="url(#f-shell)"></circle>
<circle cx="368" cy="245" r="44" fill="none" stroke="url(#f-bronze)" stroke-width="9"></circle>
<circle cx="368" cy="245" r="35" fill="url(#f-disc)"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #C2410C">Signal d'alerte</span>
<span style="font-size: 30px; line-height: 1.3; font-weight: 500; color: #0E1116">Si l'erreur grimpe d'une itération à l'autre, <span style="font-family: 'STIX Two Text', serif; font-style: italic">η</span> est trop grand : réduisez-le.</span>
</div>
</div>

<div style="padding-top: 22px; border-top: 1px solid #E4E6EA; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 24px; font-weight: 500; color: #0E1116">Ladji Lama Kamagate</span>
<span style="display: flex; align-items: center; gap: 12px">
<span style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #5F6673">Glissez</span>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>
