episode: 4
pages:

- type: couverture
  visuel:
    famille: courbe
    params:
      marquee: 4
      pivot: [500, 590]  # couverture A : près du bouton tenu par le robot (position droite)
  visuel_classique:  # couverture classique : réglages d'avant la couverture A (commit e57677b)
    famille: courbe
    params:
      marquee: 4

- type: ouverture
  rappel: "Nº 01, 02 et 03 : le modèle apprend d'exemples, et prédire le prix d'une maison est une régression."
  titre: "Deux réglages :\na et b."
  texte: "La régression linéaire prédit le prix $ŷ$ par une droite, selon la seule surface $x$ ; le chapeau marque une prédiction. Deux boutons, $a$ et $b$, la règlent."
  sources: [mlcc-glossaire-regression, mlcc-relation, mlcc-ligne, mlcc-droite, mlcc-ordonnee, mlcc-minimiser, ames-surface, ames-prix, bceao-dollar]
  visuel:
    famille: courbe
    calcul: prediction_surface  # ŷ = a·x + b au point x, et x en m² : la sortie et l'entrée affichées
    params:
      forme: droite
      origine: [100, 380]
      echelle: [270, 1.2]
      domaine: [0, 3]
      plage: [0, 280]
      a: 74  # calculs.ames.droite_prix_surface() : a et b arrondis
      b: 4
      x: 1.5
      triangle: 0.4
      decalage: [0, 78]
      textes:
        x: surface (centaines de m²)
        y: prix (millions de FCFA)
        a: "$a$ = 74 : l'inclinaison"
        b: "$b$ = 4 : la hauteur de départ (ordonnée à l'origine)"
        droite: $ŷ = a·x + b$
        entree: $x$ = 1,5 (150 m²)
        sortie: $ŷ$ = 115
      description: "Une droite qui monte : le prix prédit d'une maison selon sa surface. Elle coupe l'axe vertical à 4 ; un pas de 1, soit 100 m², la fait monter de 74. Avec ces réglages arrondis, pour 150 m², on lit une prédiction de 115 millions de FCFA."

- type: comparaison
  role: Comparaison
  titre: "Changer a fait pivoter,\nchanger b décale."
  texte: "Que fait chaque bouton ? Quand on change $a$ sans toucher à $b$, la droite tourne autour de son point sur l'axe vertical. Quand on change $b$, elle monte ou descend sans tourner. Sur les deux dessins, la droite de départ est en gris."
  sources: [mlcc-droite, mlcc-ordonnee, ames-ventes, ames-4000, ames-surface, ames-prix, ames-fichier, bceao-dollar]
  visuel:
    famille: courbe
    params:
      forme: pivot
      origine: [40, 270]
      echelle: [38, 30]
      domaine: [0, 10]
      plage: [0, 8.4]
      cadre: [440, 310]
      textes: {x: surface, y: prix}
  cas:
  - etiquette: $a$ change
    titre: La droite pivote
    texte: Elle garde son point sur l'axe vertical.
    params:
      forme: pivot
      a: 0.15
      b: 4
      fantomes: [0.4]
      rayon: 200
      textes: {x: surface, y: prix, a: $a$ change, b: $b$ fixe}
      description: "La droite tourne autour de son point de départ sur l'axe vertical : seul a change."
  - etiquette: $b$ change
    titre: La droite se décale
    texte: Elle garde son inclinaison.
    params:
      forme: decalage
      a: 0.4
      b: 1
      fantomes: [4]
      fleches: [2, 7]
      textes: {x: surface, y: prix, b: $b$ change}
      description: "La droite descend sans tourner : seul b change, l'inclinaison reste la même."
  encadre:
    titre: Dans l'exemple des maisons
    texte: "Sur les ventes de maisons d'Ames, une ville des États-Unis, de 2006 à 2010, le calcul donne $a$ = 74 et $b$ = 4 : chaque centaine de m² ajoute 74 millions de FCFA au prix prédit."

- type: formule
  role: Définition
  titre: "Entraîner, c'est chercher\nles meilleurs réglages."
  texte: "Qui tourne les boutons ? C'est le rôle de l'entraînement. La forme, une droite, est choisie d'avance ; le modèle ajuste ensuite $a$ et $b$ aux exemples. Ces deux nombres sont ses paramètres, ce qu'il a appris des exemples. On les désigne souvent ensemble par la lettre grecque $θ$ (thêta)."
  sources: [mlcc-parametre, mlcc-entrainement, mlcc-minimiser, mlcc-equation, ds100-theta]
  panneau:
    phrase: "Entraîner un modèle, c'est trouver les paramètres qui donnent le meilleur modèle."
  lignes:
  - sens: "Ici, les paramètres $θ$ sont les deux nombres $a$ et $b$."
  - sens: Ils sont calculés pendant l'entraînement, à partir des exemples.
  - sens: "« Meilleurs » dépend d'un critère : pour chaque maison vendue, l'écart entre le prix prédit par la droite et le vrai prix de vente doit être le plus petit possible. Il faut donc d'abord mesurer cet écart."

- type: fin
  points:
  - "$ŷ$ = $a$·$x$ + $b$ : deux réglages, $a$ et $b$."
  - "Changer $a$ fait pivoter la droite, changer $b$ la décale."
  - "Entraîner, c'est chercher les réglages : l'écart entre prix prédit et vrai prix de vente doit être le plus petit possible."
  verification:
    question: "Si seul $b$ change, que fait la droite ?"
    page: 3

linkedin:
  texte: |-
    2 925 ventes de maisons en entrée.
    Deux nombres en sortie : 74 et 4.

    C'est tout ce que garde une droite tracée au plus près de ces ventes d'Ames, une ville des États-Unis, pour prédire le prix d'une maison selon sa surface. Ce modèle se lit en deux parties :

    Ce qui est choisi d'avance : la forme, ici une droite.
    Ce qui est appris pendant l'entraînement, la phase où le modèle étudie les exemples : les paramètres, ici 74 et 4.

    Un réseau de neurones, modèle bien plus complexe qu'une droite, se lit de la même façon : une forme choisie d'avance, des paramètres appris, seulement bien plus nombreux.

    Le premier, 74, dit que chaque 100 m² de plus ajoute 74 millions de FCFA au prix prédit. Le second réserve une surprise : c'est le prix prédit pour une maison de 0 m², qui n'existe pas. C'est un point de départ du calcul, pas une vente.

    Que fait chacun de ces nombres à la droite ? La réponse est dans les pages.

    Ce modèle ne garde aucune vente, seulement un résumé, qui, comme tout résumé, laisse des détails de côté.
  hashtag: "#RegressionLineaire"
