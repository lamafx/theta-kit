- type: ouverture
  rappel: "Nº 05 : une droite a deux réglages, $a$ et $b$ ; Nº 06 : la pente du coût $J$ selon un seul réglage."
  titre: "Une pente\npar réglage."
  texte: "Bougeons $a$ seul, $b$ fixé : la pente de $J$ est la dérivée partielle selon $a$. Idem pour $b$. Rangées dans un vecteur, ces pentes forment le gradient $∇J$."
  sources: [d2l-plusieurs, dlb-plusieurs, d2l-partielle, dlb-partielle, mit-taux, d2l-vecteur, dlb-gradient, mit-vecteur, d2l-nabla, mit-symbole]
  visuel:
    famille: flux
    params:
      forme: page
      lignes:
      - {etiquette: "Dérivée partielle selon a", etapes: ["a bouge, b fixé", "Coût J(a, b)", "Pente selon a"]}
      - {etiquette: "Dérivée partielle selon b", etapes: ["b bouge, a fixé", "Coût J(a, b)", "Pente selon b"]}
      - {etiquette: "Rangées dans un vecteur", etapes: [["Pente selon a", "Pente selon b"], "!Gradient ∇J"]}
      description: "Trois schémas. a bouge, b fixé : le coût J donne la pente selon a. b bouge, a fixé : le coût J donne la pente selon b. Les deux pentes, rangées ensemble, forment le gradient nabla J, en bleu."

- type: mecanisme
  role: Mécanisme
  titre: "$∇J$ pointe vers\nla montée la plus raide."
  texte: "Prenons un coût simple, choisi pour l'exemple : $J$ = $a$² + 3$b$². Sur la carte des réglages, les lignes de niveau relient les points de même coût. Hors du centre, $∇J$ est perpendiculaire à la ligne de niveau et pointe vers la montée la plus raide."
  sources: [mit-plan, mit-perpendiculaire, mit-exemple, dlb-plus-vite, dlb-montee, dlb-critique, dlb-sans-direction]
  visuel:
    famille: niveaux
    params:
      forme: carte
      origine: [460, 225]
      echelle: 100
      domaine: [-3.4, 3.4]
      plage: [-2, 2]
      cadre: [920, 450]
      courbures: [1, 3]
      niveaux: [1, 4, 7]
      longueur: 12
      points:
      - {point: [1, 1], valeurs: true, angle_droit: true, decalage: [14, 8]}
      - {point: [2, -1], valeurs: true, decalage: [14, 8]}
      - {point: [-2, 0], decalage: [-14, -16]}
      - {point: [0, 0]}
      textes: {x: réglage $a$, y: réglage $b$, gradient: ∇J, minimum: "∇J = (0 ; 0)"}
      description: "Lignes de niveau en ellipses du coût J égal a au carré plus 3 b au carré, sur les réglages a et b. En trois points, la flèche nabla J part à angle droit de la ligne de niveau, vers l'extérieur, là où le coût monte : en (1 ; 1), nabla J = (2 ; 6) ; en (2 ; −1), (4 ; −6) ; en (−2 ; 0), elle pointe vers la gauche. Au centre, nabla J = (0 ; 0)."
  encadres:
  - titre: Au fond de la vallée
    texte: "Toutes les dérivées partielles y sont nulles : $∇J$ = (0 ; 0) n'indique **aucune direction**."

- type: exemple
  role: Exemple chiffré
  titre: "$∇J$ par le calcul."
  texte: "Pour $J$ = $a$² + 3$b$², on dérive en $a$, $b$ fixé : 2$a$. Puis en $b$, $a$ fixé : 3 fois 2$b$, soit 6$b$. Donc $∇J$ = (2$a$ ; 6$b$), ici aux points de la carte."
  sources: [d2l-partielle, d2l-puissance, d2l-multiple, d2l-somme, d2l-constante, dlb-element, dlb-critique]
  tableau:
    calcul: gradient_tableau
    params: {points: [[1, 1], [2, -1], [-2, 0], [0, 0]], courbures: [1, 3]}
    colonnes:
    - {titre: $a$, champ: a}
    - {titre: $b$, champ: b}
    - {titre: Coût $J$, champ: cout}
    - {titre: "Selon $a$ : 2$a$", champ: da, style: accent}
    - {titre: "Selon $b$ : 6$b$", champ: db, style: accent}
  visuel:
    famille: niveaux
    params:
      forme: carte
      origine: [460, 150]
      echelle: 70
      domaine: [-3.4, 3.4]
      plage: [-2, 2]
      cadre: [920, 300]
      courbures: [1, 3]
      niveaux: [1, 4, 7]
      longueur: 8
      points:
      - {point: [1, 1], valeurs: true, decalage: [-205, 8]}
      - {point: [2, -1], valeurs: true, decalage: [14, 8]}
      - {point: [-2, 0], valeurs: true, decalage: [-150, -16]}
      - {point: [0, 0]}
      textes: {x: réglage $a$, y: réglage $b$, gradient: ∇J, minimum: "∇J = (0 ; 0)"}
      description: "La carte des lignes de niveau de J égal a au carré plus 3 b au carré, avec les valeurs du tableau : en (1 ; 1), nabla J = (2 ; 6) ; en (2 ; −1), (4 ; −6) ; en (−2 ; 0), (−4 ; 0). Au centre, nabla J = (0 ; 0)."
  conclusion: "En (1 ; 1), $∇J$ = (2 ; 6) : la flèche de la carte. Au fond, en (0 ; 0), $∇J$ = (0 ; 0)."

- type: fin
  points:
  - "Bougeons $a$ seul, $b$ fixé : la pente de $J$ est la dérivée partielle."
  - "Rangées dans un vecteur, ces pentes forment le gradient $∇J$."
  - "Sur la carte, $∇J$ est perpendiculaire à la ligne de niveau et pointe vers la montée la plus raide."
  verification:
    question: "Sur la carte, que fait $∇J$ face à une ligne de niveau ?"
    page: 3

linkedin:
  texte: |-
    Le gradient ne pointe pas vers le minimum.
    Même son opposé n'y mène pas forcément tout droit.

    Prenons J = a² + 3b², au point (1 ; 1).

    Le minimum est en (0 ; 0) : il faudrait réduire a et b autant l'un que l'autre, direction (−1 ; −1).
    Le gradient vaut (2 ; 6) : son opposé indique (−2 ; −6), à environ 27 degrés de cette direction.

    La flèche se trompe-t-elle ? Non : elle ne connaît pas le minimum. Elle répond à une question locale : quels réglages pèsent le plus sur le coût, ici ? En ce point, b pèse trois fois plus que a.

    C'est tout l'intérêt du gradient. Dès que plusieurs paramètres doivent être ajustés en même temps, une seule pente ne suffit plus : il faut savoir comment chacun d'eux pèse sur le coût.

    Si la flèche ne vise pas le but, comment arrive-t-on quand même ? En la recalculant à chaque pas.
  hashtag: "#Gradient"
  generique: "#Mathematiques"
