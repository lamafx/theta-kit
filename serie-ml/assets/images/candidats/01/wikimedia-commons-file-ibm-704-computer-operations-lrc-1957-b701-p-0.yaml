description_source: 'IBM 704 Computer Operations People on the photo are: Woman in the front with her back to the
  camera is Jean Ruddle Migneault. She provided the names for the rest of the staff in the photo. Kathy Christian
  Young, Mary Talmage Kaylor, Willie Terrell Ruffin (computer operator not mathematician), Joyce Alston Clemens,
  Lou Mayo Ladson, Rachel Richardson Mayo, Sadie Livingston Boyer , Joann Shipp Buschman worked in hangar in West
  Area, Shelva Blevins Stroud (programmer in data reduction), Jackie Kilby, Rita Englebert, Harriet Seals Winestein,
  Lillian Boney, Jane Thompson Kemper, Helen Thompson ( math aide) Jane and Helen were daughters of Floyd Thompson,
  center director.'
