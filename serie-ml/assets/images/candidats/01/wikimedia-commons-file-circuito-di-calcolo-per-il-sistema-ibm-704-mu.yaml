description_source: 'Il dispositivo è costituito da un telaio di plastica avente la parte superiore in acciaio Sulla
  parte superiore sono inserite 6 valvole termoioniche (pentodi, codici: 6136 e 6AU6WA) ed un relé; nella parte
  interna una serie di componenti elettronici sono assemblati in un circuito e connessi tra loro con cavi di rame
  ricoperto e stagnature: si tratta di resistori, condensatori, diodi, e altri componenti tra i quali varie bobine
  di arresto della propagazione di segnali di disturbo. I cavi più lunghi sono intrecciati tra loro Sulla parte
  inferiore del telaio si trova una morsettiera metallica per la connessione elettrica di questo dispositivo nel
  sistema. Funzione Il dispositivo è un modulo standard di circuito elettronico, sostituibile; la sua funzione specifica
  integra l''esecuzione di operazioni logiche e aritmetiche del calcolatore. Modalità d''uso L''utilizzo avveniva
  all''interno del sistema IBM704. Notizie storico-critiche Il calcolatore IBM 704 è di tipo scientifico, molto
  utilizzato per calcoli ingegnieristici e scientifici. Il sistema 704, presenta una memoria interna a nuclei magnetici
  (nuclei di ferrite) che sostituisce quelle a tubi catodici e di tipo elettrostatico dei predecessori, questo innalza
  la velocità di calcolo grazie alla drastica riduzione dei tempi di accesso alla memoria interna: da millesimi
  di secondo a circa 12 milionesimi di secondo. Il sistema continua ad avere diversi livelli fisici di memoria,
  compreso un tamburo magnetico che aiuta la memoria interna per lo più memorizzando parte dei programmi, tabelle
  di calcolo e risultati intermedi del processo I circuiti che eseguivano le operazioni logico aritmetiche continuano
  ad essere quasi esclusivamente costituiti da moduli di circuiti a valvole termoioniche come i predecessori di
  questa generazione di calcolatori. Rispetto ai predeccessori, per il calcolo scientifico, il nuovo calcolatore
  viene dotato dell''aritmetica floating-point (a virgola mobile) e di varie nuove istruzioni Inoltre, appositamente
  per il 704, viene impostato da John W. Backus, uno dei capo progetto della IBM, il linguaggio FORTRAN (FORmula
  TRANslot). Il programma venne distribuito a tutti i clienti che avevano ordinato il 704 e questo fu per un vero
  e proprio test al linguaggio che permise la definizione del compilatore in 6 mesi anzicché in 2 anni come previsto
  Il calcolatore IBM 704 è stato prodotto dal 1954 al 1960.'
