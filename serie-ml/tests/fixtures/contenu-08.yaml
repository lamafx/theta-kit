# Fixture de test (B2) : épisode 08, textes recopiés des canevas de design/canevas-gabarits/.
# La typographie 9.4 (apostrophe, espaces insécables) est appliquée par le générateur.
# Chaque courbe vient de calculs/descente_gradient.py. Ce n'est pas une production : contenu/ reste vide.
episode: 8
pages:

- type: couverture
  visuel:
    famille: niveaux
    calcul: descente_gradient_2d
    params:
      # Session de design n° 2 : couverture A, motif dans la zone du geste « visière » (droite), à 0,42 de l'ancien.
      centre: [540, 400]
      ellipses: [280, 240, 205, 175, 145, 118, 92]
      opacites: [0.12, 0.17, 0.23, 0.3, 0.38, 0.48, 0.6]
      depart: [-212, -65]
      eta: 0.1
      courbures: [1.3, 7.79]
      pas: 3
  visuel_classique:  # couverture classique (avant la couverture A) : les réglages d'origine, motif pleine largeur
    famille: niveaux
    calcul: descente_gradient_2d
    params:
      centre: [540, 300]
      ellipses: [660, 570, 490, 415, 345, 280, 220]
      opacites: [0.08, 0.12, 0.17, 0.24, 0.33, 0.45, 0.6]
      depart: [-504, -154]
      eta: 0.1
      courbures: [1.3, 7.79]
      pas: 3

- type: ouverture
  rappel: On sait mesurer l'erreur (Nº 05) et lire une pente (Nº 06 et 07).
  titre: "Descente\nde gradient."
  texte: Le modèle ne voit pas toute la courbe d'erreur. Il mesure la pente là où il se trouve, puis fait un pas dans l'autre sens.
  visuel:
    famille: courbe
    calcul: descente_gradient
    params:
      forme: descente
      origine: [460, 340]
      echelle: [105, 20]
      axe: 372
      theta0: -3.4
      eta: 0.15
      pas: 5
      textes:
        gradient: la pente monte
        pas: le pas, à l'opposé
        courbe: erreur $J(θ)$
        minimum: minimum
        axe: paramètre θ
      description: "Courbe d'erreur en U. Le point de départ θ0 est haut sur la pente gauche ; la pente monte vers la gauche, une flèche bleue descend vers θ1, puis des pas de plus en plus courts mènent au minimum."
  legende: Les pas raccourcissent à mesure que la pente s'aplatit.

- type: mecanisme
  role: Mécanisme
  titre: "Pente forte, grand pas.\nPente faible, petit pas."
  texte: "Le pas vaut $!η$ × la pente, où $!η$, le taux d'apprentissage, est un réglage fixe (ici, avec un seul paramètre). Loin du minimum, la courbe est raide : le modèle avance vite. Près du minimum, elle s'aplatit et les pas raccourcissent d'eux-mêmes."
  visuel:
    famille: courbe
    calcul: descente_gradient
    params:
      forme: pentes
      origine: [460, 380]
      echelle: [105, 22]
      axe: 410
      eta: 0.15
      points:
      - {theta: -3, decalage: [85, 80]}
      - {theta: -0.8, decalage: [-150, -30]}  # session de design n° 2 : étiquette en 22 px, hors de la flèche du pas
      textes:
        pente: pente
        pas: pas
        minimum: minimum
        courbe: erreur $J(θ)$
        axe: paramètre θ
      description: "Courbe d'erreur en U. Au point θ = −3, la tangente est raide (pente −6) et le pas vaut 0,9. Au point θ = −0,8, la tangente est douce (pente −1,6) et le pas vaut 0,24."
  encadres:
  - titre: Loin du minimum
    texte: "Pente raide : **grands pas**, on gagne du temps."
  - titre: Près du minimum
    texte: "Pente douce : **petits pas**, on ne dépasse pas."

- type: comparaison
  role: Comparaison
  titre: "Le bon pas : ni trop petit,\nni trop grand."
  texte: Même courbe, même départ, trois valeurs de $!η$. Seule la taille du pas change, et avec elle tout le comportement de l'apprentissage.
  visuel:
    famille: courbe
    calcul: descente_gradient
    params:
      forme: comparaison
      origine: [140, 200]
      echelle: [26, 7.3]
      domaine: [-4.9846, 4.9846]
      theta0: -3.6
  cas:
  - etiquette: $η$ = 0,05
    titre: Trop lent
    texte: Après 5 pas, toujours loin du creux.
    params: {eta: 0.05, pas: 5, description: "η égal 0,05 : cinq petits pas, le point reste loin du minimum."}
  - etiquette: $η$ = 0,3
    titre: Convergence
    texte: 4 pas suffisent pour atteindre le creux.
    retenu: true
    params: {eta: 0.3, pas: 4, description: "η égal 0,3 : quatre pas suffisent pour atteindre le minimum."}
  - etiquette: $η$ = 1,05
    titre: Divergence
    texte: "Chaque pas rebondit plus haut : l'erreur explose."
    alerte: true
    params: {eta: 1.05, pas: 3, description: "η égal 1,05 : chaque pas saute de l'autre côté de la courbe, de plus en plus haut. L'erreur augmente."}
  encadre:
    titre: En pratique
    texte: On teste plusieurs valeurs de $η$, souvent entre 0,001 et 0,1, et on garde celle qui fait baisser l'erreur le plus vite sans rebondir.

- type: formule
  role: Formule
  titre: Tout tient en une ligne.
  texte: Ce qu'on vient de voir s'écrit avec une seule règle. On l'applique à chaque itération $t$, encore et encore, jusqu'à ce que la pente soit presque nulle.
  panneau:
    formule: θ_{t+1} = θ_t [−η]∇J(θ_t)
  lignes:
  - symbole: θ_t
    sens: les paramètres du modèle à l'itération $t$
  - symbole: ∇J(θ_t)
    sens: la pente de l'erreur, là où se trouve le modèle
  - symbole: "[η]"
    sens: "le taux d'apprentissage : la taille du pas"
  - symbole: "[−]"
    sens: on va dans le sens opposé à la pente

- type: exemple
  role: Exemple chiffré
  titre: Trois pas, à la main.
  texte: Prenons l'erreur $J$($θ$) = $θ$², dont la pente vaut 2$θ$. On part de $θ$ = 3, avec $!η$ = 0,1.
  tableau:
    calcul: descente_gradient_tableau
    params: {theta0: 3, eta: 0.1, pas: 3}
    colonnes:
    - {titre: Pas, champ: pas}
    - {titre: θ, champ: theta}
    - {titre: Pente 2θ, champ: pente}
    - {titre: Pas η × pente, champ: deplacement, style: accent}
    - {titre: Nouveau θ, champ: nouveau, style: gras}
  visuel:
    famille: courbe
    calcul: descente_gradient
    params:
      forme: iterations
      origine: [180, 320]
      echelle: [200, 27]
      echantillons: [-0.5, 3.3, 0.19]
      theta0: 3
      eta: 0.1
      pas: 3
      decalages: [[20, 5], [20, 3.5], [20, 3.5], [12.8, 25.7]]
      textes:
        erreur: J
        origine: θ = 0
        axe: paramètre θ
      description: "Courbe J égale thêta au carré. Quatre points descendent la pente : thêta 3 (erreur 9), 2,4 (5,76), 1,92 (3,69), 1,536 (2,36)."
  conclusion: L'erreur passe de 9 à 2,36 en trois pas, et chaque pas est plus court que le précédent.

- type: piege
  role: Piège
  titre: "Pente nulle ne veut pas\ndire erreur nulle."
  texte: "Au minimum, la pente vaut zéro et la descente s'arrête. Mais l'erreur peut rester élevée : le modèle est seulement le meilleur que sa forme permet."
  visuel:
    famille: courbe
    params:
      forme: plancher
      origine: [460, 400]
      echelle: [100, 13.125]
      fonction: {a: 1, c: 11.43}
      textes:
        zero: erreur = 0
        pente: pente = 0
        ecart: erreur restante
        courbe: erreur $J(θ)$
        axe: paramètre θ
      description: "Courbe d'erreur en U dont le creux reste haut au-dessus de la ligne erreur égale zéro. Au creux, la tangente est plate (pente nulle). Une accolade orange mesure l'erreur restante entre le creux et zéro."
  encadre:
    titre: Ce que ça veut dire
    texte: "Pour réduire encore l'erreur, il ne sert à rien de continuer à descendre : il faut **changer de modèle**."

- type: fin
  points:
  - Le gradient indique où l'erreur monte. On avance dans l'autre sens.
  - "Le pas vaut $η$ × la pente : il raccourcit près du minimum."
  - "$η$ trop petit : c'est lent. Trop grand : ça diverge."
  verification:
    question: Pourquoi les pas raccourcissent-ils près du minimum ?
    page: 3

# Texte du post (charte/texte-linkedin.md, exemple de l'épisode 08).
linkedin:
  accroche: "Un modèle de Machine Learning n'apprend pas comme nous.\nIl descend une pente."
  intuition: "Imaginez un bol : la hauteur est l'erreur, le fond est le meilleur modèle. Les yeux bandés, vous ne voyez pas le fond, mais vous sentez sous vos pieds dans quel sens le sol descend. Vous faites un pas dans ce sens, puis vous recommencez. Plus le sol est raide, plus le pas est long."
  promesse: "Dans le carrousel : pourquoi les pas raccourcissent d'eux-mêmes près du minimum, ce que règle le taux d'apprentissage η, et ce qui se passe quand il est mal choisi : trop petit, l'apprentissage traîne ; trop grand, il diverge."
  question: Quelle notion de ML vous a le plus bloqué au début ?
  hashtag: "#DeepLearning"
