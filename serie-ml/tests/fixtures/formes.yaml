      origine: [220, 150]
      echelle: 55
      domaine: [-3.8, 3.8]
      plage: [-2.6, 2.6]
      cadre: [440, 300]
      courbures: [1, 3]
      niveaux: [1, 4, 9]
    cas:
    - chemins: [{depart: [-3, 1.5], eta: 0.15, pas: 40, bruit: 4, graine: 7}]
      alerte: true
      description: "Avec un taux fixe, le chemin bruité rebondit autour du minimum sans s'y poser."
    - chemins: [{depart: [-3, 1.5], eta: 0.15, pas: 40, bruit: 4, decroissance: true, graine: 7}]
      description: "Avec un taux qui décroît, le même chemin bruité se resserre près du minimum."
  - legende: chemin sur une selle · un chemin cale au point selle, l'autre s'en écarte (mécanisme, épisode 10)
    params:
      forme: chemin
      origine: [460, 225]
      echelle: 130
      domaine: [-2.4, 2.4]
      plage: [-1.65, 1.65]
      cadre: [920, 450]
      courbures: [1, -1]
      niveaux: [-2, -1, 0, 1, 2]
      chemins:
      - {depart: [-2.2, 0], eta: 0.1, pas: 20, style: objet, texte: cale au point selle, decalage: [-10, 34]}
      - {depart: [-2.2, 0.08], eta: 0.1, pas: 20, texte: s'en écarte, ancre: 16, decalage: [18, 6]}
      textes: {minimum: point selle}
      description: "Lignes de niveau en hyperboles autour d'un point selle : un creux selon le réglage horizontal, une bosse selon le vertical. Un chemin parti sur l'axe cale au point selle ; un autre, parti à peine au-dessus, finit par s'en écarter."
