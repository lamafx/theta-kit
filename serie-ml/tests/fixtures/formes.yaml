      origine: [460, 225]
      echelle: 100
      domaine: [-3.6, 3.6]
      plage: [-2.1, 2.1]
      cadre: [920, 450]
      courbures: [1, 3]
      niveaux: [1, 4, 9]
      chemins:
      - {depart: [-3, 1.3], eta: 0.1, pas: 12, style: objet, texte: tout le jeu, decalage: [-40, -24]}
      - {depart: [3, 1.5], eta: 0.1, pas: 25, bruit: 3, lot: 1, graine: 4, style: contexte, texte: un exemple, decalage: [-60, -24]}
      - {depart: [1.6, -1.9], eta: 0.1, pas: 25, bruit: 3, lot: 16, graine: 4, texte: un mini-lot, decalage: [24, 8]}
      textes: {}
      description: "Lignes de niveau en ellipses et trois chemins : la descente sur tout le jeu, régulière ; sur un exemple, qui zigzague ; sur un mini-lot, moins bruitée. Tous arrivent près du minimum, marqué d'une croix."
