- nom: Formes-Niveaux
  titre: Lignes de niveau · carte, gradient, chemins et selle
  famille: niveaux
  hauteur: 2450
  formes:
  - legende: carte · ∇J perpendiculaire aux niveaux, vers la montée (mécanisme, épisode 07)
    params:
      forme: carte
      origine: [460, 225]
      echelle: 100
      domaine: [-3.4, 3.4]
