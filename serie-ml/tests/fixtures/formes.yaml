      description: "Lignes de niveau en ellipses de J(a, b) = a² + 3b². En trois points, la flèche ∇J part perpendiculaire à la ligne de niveau, vers l'extérieur : en (1, 1), ∇J = (2 ; 6) ; en (2, −1), (4 ; −6). Au centre, ∇J = (0 ; 0)."
