# Planches des formes de page (session de design n° 1) : une planche par famille, chaque forme à sa taille
# réelle. Ce n'est pas une production : les valeurs des tableaux sont des valeurs d'essai ; les images, points
# et droites viennent de calculs/.
- nom: Formes-Grille
  titre: Grille · 3 formes
  famille: grille
  hauteur: 1700
  formes:
  - legende: ligne · un exemple, une ligne (ouverture)
    params:
      forme: ligne
      colonnes: [surface (m²), chambres, quartier, prix (k€)]
      valeurs: [84, 3, Centre, 312]
      textes: {ligne: une maison}
      description: "Une ligne de tableau entre des lignes grises : 84 m², 3 chambres, quartier Centre, prix 312 k€. La dernière case, le prix, est en bleu."
  - legende: tableau · exemples, caractéristiques, étiquette (mécanisme)
    params:
      forme: tableau
      colonnes: [surface (m²), chambres, quartier, prix (k€)]
      lignes:
      - [84, 3, Centre, 312]
      - [52, 2, Gare, 189]
      - [120, 4, Parc, 455]
      - [67, 2, Centre, 248]
      - [95, 3, Port, 301]
      fenetre: {colonne: 0, texte: une caractéristique}
      textes: {exemples: exemple, caracteristiques: caractéristiques, etiquette: étiquette}
      description: "Tableau de cinq maisons. Chaque ligne est un exemple ; les trois premières colonnes sont les caractéristiques ; la dernière, le prix, est l'étiquette. La colonne surface est encadrée."
  - legende: pixels · une image devient des nombres (piège)
    params:
      forme: pixels
      chiffre: 0
      fenetre: {ligne: 3}
      textes: {image: ce que l'on voit, nombres: ce que reçoit la machine, fleche: devient}
      description: "Un zéro manuscrit en 8 × 8 cases bleues plus ou moins foncées, puis la même grille où chaque case porte sa valeur, de 0 à 16. La quatrième rangée est encadrée des deux côtés."
- nom: Formes-Courbe
  titre: Courbe · droites, tangentes et creux
  famille: courbe
  hauteur: 2800
  formes:
  - legende: tangentes · la pente en trois points, sans pas (mécanisme, épisode 06)
    params:
      forme: tangentes
      origine: [460, 400]
      echelle: [110, 26]
      domaine: [-3.4, 3.4]
      axe: 410
      cadre: [920, 450]
      points:
      - {theta: -2, decalage: [-178, -18]}
      - {theta: 0, decalage: [26, -22]}
      - {theta: 2, triangle: true, decalage: [-150, -14]}
      textes: {pente: pente, courbe: $J(a) = a²$, axe: réglage $a$}
      description: "Une courbe en U et ses tangentes en trois points : descendante (pente −4), plate au creux (pente 0), montante (pente 4). En a = 2, un pas de 1 sur la tangente la fait monter de 4."
  - legende: trace · une courbe à deux creux, la descente arrêtée dans le premier (ouverture, épisode 10)
    params:
      forme: trace
      courbe: ondulee
      origine: [300, 250]
      echelle: [200, 96]
      domaine: [-1, 2]
      plage: [-1.3, 2]
      cadre: [920, 450]
      creux: true
      descentes:
      - {depart: -0.9, eta: 0.05, pas: 30, texte: départ, decalage: [-20, -22]}
      position_x: [820, 282]
      textes: {x: réglage $θ$, y: coût $J$, minimum_local: minimum local, minimum_global: minimum global}
      description: "Une courbe à deux creux. Partie à gauche, la descente s'arrête dans le premier creux, le minimum local, plus haut que le minimum global à droite."
  - legende: trace avec corde · convexe, la corde reste au-dessus (repère, épisode 10)
    params:
      forme: trace
      courbe: parabole
      origine: [460, 400]
      echelle: [130, 36]
      domaine: [-3, 3]
      plage: [0, 9.5]
      cadre: [920, 450]
      corde: [-2, 1]
      textes: {x: réglage $θ$, y: coût $J$, corde: la corde reste au-dessus}
      decalage_corde: [110, -30]
      description: "Une courbe en U et une corde entre deux de ses points : le segment reste au-dessus de la courbe."
  - legende: droite · ŷ = a·x + b, les deux réglages (ouverture)
    params:
      forme: droite
      origine: [110, 370]
      echelle: [76, 42]
      domaine: [0, 10]
      plage: [0, 8.2]
      a: 0.6
      b: 1.5
      x: 7
      triangle: 2.5
      decalage: [0, -14]
      textes:
        x: entrée $x$
        y: prédiction $ŷ$
        a: $a$, la pente
        b: $b$, la hauteur en $x$ = 0
        droite: $ŷ = a·x + b$
        entree: $x$
        sortie: $ŷ$
      description: "Une droite qui monte. Un pas de 1 vers la droite la fait monter de a ; elle coupe l'axe vertical à la hauteur b. Pour une entrée x, on lit la prédiction ŷ sur la droite."
  - legende: pivot et décalage · une case de comparaison chacun (comparaison)
    params:
      origine: [40, 270]
      echelle: [38, 30]
      domaine: [0, 10]
      plage: [0, 8.4]
      cadre: [440, 300]
      textes: {x: $x$, y: $ŷ$}
    cas:
    - forme: pivot
      a: 0.25
      b: 2
      fantomes: [0.7]
      rayon: 200
      textes: {x: $x$, y: $ŷ$, a: $a$ change, b: $b$ fixe}
      description: "La droite tourne autour de son point de départ sur l'axe vertical : seule la pente a change."
    - forme: decalage
      a: 0.4
      b: 1
      fantomes: [4]
      fleches: [2, 7]
      textes: {x: $x$, y: $ŷ$, b: $b$ change}
      description: "La droite descend sans tourner : seule la hauteur b change, la pente reste la même."
