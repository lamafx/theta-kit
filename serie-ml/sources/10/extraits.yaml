# en LaTeX comme dans la source, numéros d'équation retirés, retours à la ligne du HTML joints par une espace),
# MLCC Gradient descent (page HTML, ajoutée à la fiche 10 : « comme la MSE d'une droite », page 4, n'est écrit ni
