# Extraits mot pour mot de la référence de la fiche 03 (DLB ch. 5), lus le 2026-10-26.
episode: 3
extraits:
- id: dlb-supervise
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: Supervised learning algorithms experience a dataset containing features, but each example is also associated with a label or target.
  appuie: "Comparaison : en supervisé, chaque exemple a son étiquette."
- id: dlb-non-supervise
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: Unsupervised learning algorithms experience a dataset containing many features, then learn useful properties of the structure of this dataset.
  appuie: "Comparaison : en non supervisé, pas d'étiquette ; le programme apprend la structure des données."
- id: dlb-groupes
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: clustering, which consists of dividing the dataset into clusters of similar examples.
  appuie: "Comparaison : chercher des groupes d'exemples semblables."
- id: dlb-iris
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: It is a collection of measurements of different parts of 150 iris plants.
  appuie: "Comparaison : le jeu de données des iris, 150 fleurs."
- id: dlb-iris-especes
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: A supervised learning algorithm can study the Iris dataset and learn to classify iris plants into three different species based on their measurements.
  appuie: "Comparaison et repère : apprendre l'espèce d'une fleur à partir de ses mesures."
- id: dlb-flou
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: Unsupervised learning and supervised learning are not formally defined terms. The lines between them are often blurred.
  appuie: "Ouverture : des repères, pas une liste complète ; les frontières sont floues."
- id: dlb-variantes
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: Other variants of the learning paradigm are possible. For example, in semi-supervised learning, some examples include a supervision target but others do not.
  appuie: "Repère : d'autres cadres existent, comme le semi-supervisé."
- id: dlb-renforcement
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: reinforcement learning algorithms interact with an environment, so there is a feedback loop between the learning system and its experiences.
  appuie: "Mécanisme : le programme agit dans un environnement ; une boucle de retour."
- id: dlb-jeu-fixe
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: Some machine learning algorithms do not just experience a fixed dataset.
  appuie: "Mécanisme : certains algorithmes n'apprennent pas d'un jeu de données fixe."
- id: dlb-regression
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: "Regression: In this type of task, the computer program is asked to predict a numerical value given some input."
  appuie: "Repère : la régression prédit un nombre."
- id: dlb-classification
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: "Classification: In this type of task, the computer program is asked to specify which of k categories some input belongs to."
  appuie: "Repère : la classification prédit une catégorie."
- id: dlb-iris-date
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-10-26
  extrait: One of the oldest datasets studied by statisticians and machine learning researchers is the Iris dataset (Fisher, 1936).
  appuie: "Comparaison : le jeu des iris date de 1936."
- id: dlb-taches-courantes
  reference: https://www.deeplearningbook.org/contents/ml.html
  lu_sur: https://r.jina.ai/https://www.deeplearningbook.org/contents/ml.html
  lu_le: 2026-11-01
  extrait: "Some of the most common machine learning tasks include the following:"
  appuie: "Page 4 : deux tâches reviennent souvent (D12)."
- id: sb-actions
  reference: http://incompleteideas.net/book/first/ebook/node7.html
  lu_sur: http://incompleteideas.net/book/first/ebook/node7.html
  lu_le: 2026-11-01
  extrait: actions may affect not only the immediate reward but also the next situation and, through that, all subsequent rewards.
  appuie: "Page 5 : les actions peuvent changer les données reçues ensuite (D6)."
- id: levine-hors-ligne
  reference: https://arxiv.org/abs/2005.01643
  lu_sur: https://arxiv.org/abs/2005.01643
  lu_le: 2026-11-01
