  lu_le: 2026-11-02
  extrait: This paper presents a data set describing the sale of individual residential property in Ames, Iowa from 2006 to 2010. The data set contains 2930 observations
  appuie: "Ouverture, comparaison : les ventes de maisons d'Ames, 2006 à 2010 (calculs/ames.py)."
- id: ames-4000
  reference: https://doi.org/10.1080/10691898.2011.11889627
  lu_sur: http://jse.amstat.org/v19n3/decock.pdf
  lu_le: 2026-11-02
  extrait: I would recommend removing any houses with more than 4000 square feet from the data set (which eliminates these five unusual observations)
  appuie: "Ouverture, comparaison : les maisons de plus de 4 000 pieds carrés sont écartées, comme le recommande l'auteur (calculs/ames.py)."
- id: ames-surface
  reference: https://doi.org/10.1080/10691898.2011.11889627
  lu_sur: http://jse.amstat.org/v19n3/decock/DataDocumentation.txt
  lu_le: 2026-11-02
  extrait: "Gr Liv Area (Continuous): Above grade (ground) living area square feet"
  appuie: "Ouverture : l'entrée x, la surface habitable (en centaines de m², calculs/ames.py)."
- id: ames-prix
  reference: https://doi.org/10.1080/10691898.2011.11889627
  lu_sur: http://jse.amstat.org/v19n3/decock/DataDocumentation.txt
