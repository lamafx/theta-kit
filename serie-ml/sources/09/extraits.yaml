# formules en LaTeX comme dans la source, retours à la ligne du HTML joints par une espace), DLB ch. 8 (page HTML,
# ajoutée à la fiche pour la taille de mini-lot ; ε, perdu par l'extraction du texte, rétabli comme dans l'original)
# et Robbins et Monro (1951), lu sur la copie JSTOR hébergée par l'université Columbia (PDF numérisé ; l'OCR abîme
# les indices et les lettres grecques, rétablis comme dans l'original : x₁, x₂, xₙ, θ, aₙ). La page de l'éditeur
