<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Descente de gradient — Couverture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0F17}
a{color:#4C8DFF}a:hover{color:#7AAAFF}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 72px 80px 56px; background: #0A0F17; color: #EEF2F7; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">
<span style="display: flex; gap: 14px"><span style="color: {{accent}}">Nº 08</span><span style="color: #8A97A8">Apprendre de ses erreurs</span></span>
<span style="display: flex; align-items: baseline; gap: 10px; color: #8A97A8"><span style="font-family: 'STIX Two Text', serif; font-style: italic; font-size: 24px; letter-spacing: 0; text-transform: none; color: {{accent}}">θ</span>Théta</span>
</div>

<div style="position: relative; width: 920px; height: 700px; flex-shrink: 0">

<svg viewBox="0 0 1080 780" width="1080" height="780" aria-hidden="true" style="position: absolute; left: -80px; top: -30px; display: block">
<defs>
<marker id="kc-step" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4C8DFF"></path></marker>
</defs>
<g fill="none" stroke="#4C8DFF" stroke-width="1.5">
<ellipse cx="540" cy="300" rx="660" ry="277" stroke-opacity="0.08"></ellipse>
<ellipse cx="540" cy="300" rx="570" ry="239" stroke-opacity="0.12"></ellipse>
<ellipse cx="540" cy="300" rx="490" ry="206" stroke-opacity="0.17"></ellipse>
<ellipse cx="540" cy="300" rx="415" ry="174" stroke-opacity="0.24"></ellipse>
<ellipse cx="540" cy="300" rx="345" ry="145" stroke-opacity="0.33"></ellipse>

<ellipse cx="540" cy="300" rx="220" ry="92" stroke-opacity="0.6"></ellipse>
</g>
<line x1="36" y1="146" x2="162.3" y2="377.2" stroke="{{accent}}" stroke-width="2.5" marker-end="url(#kc-step)"></line>
<line x1="167" y1="386" x2="258" y2="260" stroke="{{accent}}" stroke-width="2" stroke-opacity="0.85" marker-end="url(#kc-step)"></line>
<line x1="264" y1="252" x2="328.5" y2="320.7" stroke="{{accent}}" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#kc-step)"></line>
<circle cx="36" cy="146" r="8" fill="#F5F8FC" stroke="{{accent}}" stroke-width="3"></circle>
<circle cx="167" cy="386" r="5.5" fill="{{accent}}"></circle>
<circle cx="264" cy="252" r="4.5" fill="{{accent}}"></circle>
<circle cx="336" cy="327" r="3.5" fill="{{accent}}"></circle>
</svg>

<svg viewBox="0 0 600 640" width="600" height="640" role="img" aria-label="Robot blanc vu de face, casque audio sur les oreilles, visière sombre et yeux bleus lumineux, au centre d'une carte de niveaux." style="position: absolute; left: 160px; top: 60px; display: block">
<defs>
<radialGradient id="kc-shell" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.55" stop-color="#E4E9EF"></stop><stop offset="1" stop-color="#97A3B2"></stop></radialGradient>
<radialGradient id="kc-torso" cx="50%" cy="8%" r="95%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.5" stop-color="#E1E6EC"></stop><stop offset="1" stop-color="#8F9BAA"></stop></radialGradient>
<linearGradient id="kc-visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2735"></stop><stop offset="1" stop-color="#04070B"></stop></linearGradient>
<linearGradient id="kc-bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D3A1"></stop><stop offset="0.5" stop-color="#C08A52"></stop><stop offset="1" stop-color="#7E532C"></stop></linearGradient>
<linearGradient id="kc-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F6974"></stop><stop offset="0.45" stop-color="#D9DFE6"></stop><stop offset="1" stop-color="#5A636E"></stop></linearGradient>
<radialGradient id="kc-disc" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#A3AEBB"></stop></radialGradient>
<filter id="kc-glow" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="7" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
<filter id="kc-soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter>
<linearGradient id="kc-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.74" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#000000"></stop></linearGradient>
<mask id="kc-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="640"><rect x="0" y="0" width="600" height="640" fill="url(#kc-fade)"></rect></mask>
</defs>
<g mask="url(#kc-mask)">
<path d="M60 640 C60 520 120 455 220 445 L380 445 C480 455 540 520 540 640 Z" fill="url(#kc-torso)"></path>
<path d="M60 640 C60 520 120 455 220 445 L380 445 C480 455 540 520 540 640" fill="none" stroke="#8DB8FF" stroke-opacity="0.35" stroke-width="1.5"></path>
<path d="M214 515 Q300 548 386 515" fill="none" stroke="#B7C1CD" stroke-width="2"></path>
<path d="M300 532 L300 640" fill="none" stroke="#C9D1DA" stroke-width="1.5"></path>
<circle cx="300" cy="575" r="27" fill="none" stroke="#B7C1CD" stroke-width="2"></circle>
<circle cx="300" cy="575" r="14" fill="{{accent}}" filter="url(#kc-glow)"></circle>
<circle cx="108" cy="548" r="31" fill="url(#kc-shell)"></circle>
<circle cx="108" cy="548" r="22" fill="none" stroke="url(#kc-bronze)" stroke-width="6"></circle>
<circle cx="108" cy="548" r="15" fill="url(#kc-disc)"></circle>
<circle cx="492" cy="548" r="31" fill="url(#kc-shell)"></circle>
<circle cx="492" cy="548" r="22" fill="none" stroke="url(#kc-bronze)" stroke-width="6"></circle>
<circle cx="492" cy="548" r="15" fill="url(#kc-disc)"></circle>
<rect x="266" y="360" width="68" height="86" rx="10" fill="url(#kc-metal)"></rect>
<g stroke="#3F4852" stroke-width="2" stroke-opacity="0.55">
<line x1="268" y1="392" x2="332" y2="392"></line>
<line x1="268" y1="410" x2="332" y2="410"></line>
<line x1="268" y1="428" x2="332" y2="428"></line>
</g>
<ellipse cx="300" cy="447" rx="62" ry="11" fill="url(#kc-bronze)"></ellipse>
<ellipse cx="300" cy="384" rx="96" ry="16" fill="#000000" fill-opacity="0.5" filter="url(#kc-soft)"></ellipse>
<path d="M150 214 C150 22 450 22 450 214" fill="none" stroke="#262E39" stroke-width="22" stroke-linecap="round"></path>
<path d="M150 214 C150 22 450 22 450 214" fill="none" stroke="#46505E" stroke-width="5" stroke-linecap="round"></path>
<ellipse cx="300" cy="230" rx="165" ry="150" fill="url(#kc-shell)"></ellipse>
<ellipse cx="300" cy="230" rx="165" ry="150" fill="none" stroke="#8DB8FF" stroke-opacity="0.35" stroke-width="2"></ellipse>
<path d="M170 152 Q300 116 430 152" fill="none" stroke="#C5CDD7" stroke-width="2"></path>
<rect x="182" y="180" width="236" height="140" rx="70" fill="url(#kc-visor)"></rect>
<rect x="182" y="180" width="236" height="140" rx="70" fill="none" stroke="#5E6B7B" stroke-opacity="0.6" stroke-width="2"></rect>
<path d="M208 220 Q240 194 296 190" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"></path>
<g filter="url(#kc-glow)">
<rect x="234" y="238" width="46" height="20" rx="10" fill="#9CC6FF"></rect>
<rect x="320" y="238" width="46" height="20" rx="10" fill="#9CC6FF"></rect>
</g>
<rect x="288" y="285" width="24" height="4" rx="2" fill="{{accent}}" fill-opacity="0.7"></rect>
<circle cx="132" cy="245" r="58" fill="url(#kc-shell)"></circle>
<circle cx="132" cy="245" r="58" fill="none" stroke="#8DB8FF" stroke-opacity="0.3" stroke-width="1.5"></circle>
<circle cx="132" cy="245" r="44" fill="none" stroke="url(#kc-bronze)" stroke-width="9"></circle>
<circle cx="132" cy="245" r="35" fill="url(#kc-disc)"></circle>
<circle cx="132" cy="245" r="13" fill="#DCE2E9" stroke="#8A95A2" stroke-width="2"></circle>
<circle cx="468" cy="245" r="58" fill="url(#kc-shell)"></circle>
<circle cx="468" cy="245" r="58" fill="none" stroke="#8DB8FF" stroke-opacity="0.3" stroke-width="1.5"></circle>
<circle cx="468" cy="245" r="44" fill="none" stroke="url(#kc-bronze)" stroke-width="9"></circle>
<circle cx="468" cy="245" r="35" fill="url(#kc-disc)"></circle>
<circle cx="468" cy="245" r="13" fill="#DCE2E9" stroke="#8A95A2" stroke-width="2"></circle>
</g>
</svg>
</div>

<h1 style="position: relative; z-index: 2; margin: 8px 0 0; font-size: 108px; line-height: 0.95; font-weight: 600; letter-spacing: -0.035em; color: #F5F8FC">Descente<br>de gradient<span style="color: {{accent}}">.</span></h1>
<p style="margin: 26px 0 0; max-width: 780px; font-size: 30px; line-height: 1.38; color: #A7B3C2">Comment une IA apprend de ses erreurs, un pas à la fois.</p>

<div style="margin-top: auto; padding-top: 22px; border-top: 1px solid #1E2938; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 20px; font-weight: 500; color: #F5F8FC">Ladji Lama Kamagate</span>
<span style="display: flex; align-items: center; gap: 12px">
<span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8A97A8">Glissez</span>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4C8DFF","options":["#4C8DFF","#6FA3FF","#3DDC97"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4C8DFF' };
}
}
</script>
</body>
</html>
