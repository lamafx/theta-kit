<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page Exemple — capture réelle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2D5BFF}a:hover{color:#1C3FC4}
.capture-reelle img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left;filter:grayscale(1) contrast(1.04)}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 72px 80px 56px; background: #FFFFFF; color: #0E1116; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">
<span style="display: flex; gap: 14px"><span style="color: {{accent}}">Nº 01</span><span style="color: #5F6673">Les bases</span></span>
<span style="color: #5F6673">4 / 6</span>
</div>

<span style="margin-top: 64px; font-family: 'Geist Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: {{accent}}">Exemple</span>
<h2 style="margin: 16px 0 0; font-size: 54px; line-height: 1.06; font-weight: 600; letter-spacing: -0.03em; color: #0E1116">Personne n’écrit<br>les règles du spam.</h2>
<p style="margin: 24px 0 0; max-width: 880px; font-size: 27px; line-height: 1.45; color: #3E4450">Les arnaques changent sans arrêt. Au lieu d’écrire une règle pour chacune, on montre au modèle des mails déjà triés : spam ou non. Il apprend lui-même ce qui les distingue.</p>

<figure style="margin: 40px 0 0; display: flex; flex-direction: column; gap: 14px">
<div style="width: 920px; border-radius: 20px; overflow: hidden; border: 1px solid #E4E6EA; background: #FFFFFF">
<div style="height: 44px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 8px; background: #F4F6FA; border-bottom: 1px solid #E4E6EA">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #D5DCE6"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: #D5DCE6"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: #D5DCE6"></span>
<span style="margin-left: 14px; font-family: 'Geist Mono', monospace; font-size: 14px; letter-spacing: 0.06em; color: #5F6673">Messagerie · dossier Spam</span>
</div>
<div class="capture-reelle" style="position: relative; height: 430px; background: #EEF1F5">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #5F6673">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8A919C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span style="font-family: 'Geist Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Capture réelle à déposer ici</span>
<span style="font-size: 18px">Votre dossier spam · adresses et noms floutés</span>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 128px; height: 64px; border: 2.5px solid {{accent}}; border-radius: 12px; pointer-events: none"></div>
<span style="position: absolute; right: 24px; top: 84px; background: {{accent}}; color: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; border-radius: 8px">Classé seul, sans règle écrite</span>
</div>
</div>
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px">
<span style="font-size: 20px; line-height: 1.4; color: #3E4450">Le tri se fait à partir des exemples déjà vus.</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 14px; letter-spacing: 0.06em; color: #5F6673; white-space: nowrap">Capture : Ladji Lama Kamagate</span>
</figcaption>
</figure>

<div style="margin-top: auto; padding-top: 22px; border-top: 1px solid #E4E6EA; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 20px; font-weight: 500; color: #0E1116">Ladji Lama Kamagate</span>
<span style="display: flex; align-items: center; gap: 12px">
<span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #5F6673">Glissez</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2D5BFF","options":["#2D5BFF","#2D6CDF","#0E1116"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2D5BFF' };
}
}
</script>
</body>
</html>
