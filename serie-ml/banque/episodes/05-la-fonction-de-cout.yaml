numero: 5
titre: La fonction de coût
format: long
saison: 1
chapitre:
  numero: 2
  titre: Apprendre de ses erreurs
accroche: Avant d'apprendre, une IA doit savoir à quel point elle se trompe.
couverture:
  famille: nuage
  description: nuage de points, une droite et les segments d'écart
  verbe: se tromper
  geste: gratter
prerequis_explicites: []
termes_introduits:
- terme: erreur (résidu)
  formes:
  - erreur (résidu)
- terme: fonction de coût J
  formes:
  - fonction de coût J
- terme: erreur quadratique moyenne (MSE)
  formes:
  - erreur quadratique moyenne (MSE)
pages:
- page: 1
  type: Couverture
- page: 2
  type: Ouverture
  message: 'Prédire, puis comparer : les écarts verticaux entre les points et la droite.'
- page: 3
  type: Mécanisme
  message: 'Pourquoi le carré : des erreurs toujours positives, et les grosses erreurs punies davantage. Revers
    : un seul point aberrant peut tirer toute la droite. La MSE est le coût de référence de la régression, pas de
    tous les problèmes.'
- page: 4
  type: Formule
  message: J = (1/n) Σ (ŷᵢ − yᵢ)².
- page: 5
  type: Comparaison
  message: Une bonne droite et une mauvaise droite, avec leur J.
- page: 6
  type: Mécanisme
  message: 'J selon le réglage a : une courbe en U, dont le creux est la meilleure droite.'
- page: 7
  type: Fin
episode_suivant:
  numero: 6
  transition: Pour descendre vers ce creux, il faut savoir lire une pente.
