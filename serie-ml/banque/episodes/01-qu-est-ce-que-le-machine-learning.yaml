faits_verifies:
- l'article de 1959 affirme qu'un ordinateur peut apprendre à jouer aux dames mieux que la personne qui l'a programmé,
  en 8 à 10 heures de jeu machine
- les expériences de l'article ont tourné sur un IBM 704
- l'auteur fournissait une liste de critères pour juger une position (dont l'avance en pièces), et le programme
  apprenait lesquels utiliser et quel poids leur donner
- 'en 1962, après des milliers de parties contre lui-même, le programme bat Robert Nealey, qui se présentait comme
  maître de dames (source : IBM)'
a_ne_pas_ecrire:
- la définition célèbre attribuée à Samuel, qu'on ne trouve pas dans l'article
