numero: 8
titre: La descente de gradient
format: long
saison: 1
chapitre:
  numero: 2
  titre: Apprendre de ses erreurs
accroche: Comment une IA apprend de ses erreurs, un pas à la fois.
couverture:
  famille: niveaux
  description: lignes de niveau et chemin qui converge vers le centre (couverture validée)
  verbe: chercher
  geste: visiere
prerequis_explicites: []
termes_introduits:
- terme: taux d'apprentissage η
  formes:
  - taux d'apprentissage η
- terme: itération
  formes:
  - itération
- terme: convergence
  formes:
  - convergence
- terme: oscillation
  formes:
  - oscillation
- terme: divergence
  formes:
  - divergence
pages:
- page: 1
  type: Couverture
- page: 2
  type: Ouverture
  message: Le modèle ne voit que la pente sous ses pieds, et fait un pas dans l'autre sens.
- page: 3
  type: Mécanisme
  message: 'Avec un η fixe et un seul paramètre, le déplacement vaut η × la pente : pente forte, grand pas ; pente
    faible, petit pas. Les pas raccourcissent près du minimum.'
- page: 4
  type: Comparaison
  message: 'η trop petit : on avance à peine. Bien choisi : convergence. Trop grand : oscillation, puis divergence.'
- page: 5
  type: Formule
  message: θ ← θ − η∇J(θ), symbole par symbole.
- page: 6
  type: Exemple chiffré
  message: 'J(θ) = θ², θ = 3, η = 0,1 : 3 → 2,4 → 1,92 → 1,536. L''erreur passe de 9 à 2,36.'
- page: 7
  type: Piège
  message: 'Pente nulle ne veut pas dire erreur nulle : au minimum, l''erreur peut rester élevée, et il faut alors
    changer de modèle.'
- page: 8
  type: Fin
episode_suivant:
  numero: 9
  transition: Calculer la pente sur toutes les données à chaque pas, ça coûte cher.
