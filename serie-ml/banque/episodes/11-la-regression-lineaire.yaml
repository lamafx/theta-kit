  - ajustement
pages:
- page: 1
  type: Couverture
- page: 2
  type: Ouverture
  message: 'Le prix selon la surface : ŷ = w·x + b.'
- page: 3
  type: Mécanisme
  message: Une droite au hasard, puis MSE, gradient et pas, en boucle.
- page: 4
  type: Comparaison
  message: La droite après 0, 10 et 100 itérations.
- page: 5
  type: Formule
  message: ∂J/∂w = (2/n) Σ (ŷ − y)·x et ∂J/∂b = (2/n) Σ (ŷ − y).
- page: 6
  type: Piège
  message: Une droite ne suit pas une relation courbe.
- page: 7
  type: Fin
episode_suivant:
  numero: 12
  transition: Le prix ne dépend pas que de la surface.
